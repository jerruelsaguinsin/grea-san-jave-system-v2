<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity Log — Grea San Jave</title>
  <link rel="stylesheet" href="css/anika.css" />
</head>

<body>
  <div id="toastContainer" aria-live="polite"></div>

  <header class="app-header">
    <div class="brand">
      <img src="../grea_logo.jpg" alt="Grea San Jave logo" onerror="this.style.display='none'" />
      <span class="brand-text"><span class="secondary">Grea</span> San <span class="accent">Jave</span></span>
    </div>
    <nav class="app-nav">
      <a href="#" id="dashboardNavLinkLog">Dashboard</a>
      <a href="account-management.html">Account Management</a>
      <a href="activity-log.html" class="active">Audit Trail</a>
      <a href="profile.html">My Profile</a>

    </nav>
    <div class="session-info">
      <span id="currentUserLabelLog"></span>
      <button type="button" id="logoutBtnLog" class="btn btn-secondary btn-small">Log Out</button>
    </div>
  </header>

  <main>
    <h1 class="page-title">Audit Trail</h1>
    <!-- <p class="page-subtitle">Record-changing actions only — staff-facing, read-only, and immutable. Passive browsing is intentionally not logged.</p> -->

    <div class="card">
      <div class="toolbar">
        <div class="form-group" style="flex:2; min-width:220px;">
          <label for="logSearchInput">Search (action, details, actor type)</label>
          <input type="search" id="logSearchInput" placeholder="Search activity..." />
        </div>
        <div class="form-group">
          <label for="logActionFilter">Action Type</label>
          <select id="logActionFilter">
            <option value="ALL">All Actions</option>
          </select>
        </div>
        <div class="form-group">
          <label for="logActorFilter">Actor Type</label>
          <select id="logActorFilter">
            <option value="ALL">All Actors</option>
            <option value="Owner">Owner</option>
            <option value="Staff">Staff</option>
            <option value="Customer">Customer</option>
          </select>
        </div>
        <button type="button" id="logSortToggleBtn" class="btn btn-secondary">Newest First ▾</button>
        <button type="button" id="openExportAuditBtn" class="btn btn-primary">Export Audit Logs</button>
      </div>
    </div>

    <div class="card suspicious-card">
      <h2 class="card-title suspicious-title">Suspicious Activities</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Log ID</th>
              <th>Timestamp</th>
              <th>Actor</th>
              <th>Action</th>
              <th>Target</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="suspiciousLogTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Log ID</th>
              <th>Timestamp</th>
              <th>Actor</th>
              <th>Action</th>
              <th>Target</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="logTableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="exportAuditModalOverlay">
    <div class="modal-box export-modal-box">
      <h2 class="card-title">Export Audit Logs</h2>
      <form id="exportAuditForm">
        <div class="form-row">
          <div class="form-group">
            <label for="exportStartDate">From</label>
            <input type="date" id="exportStartDate" />
          </div>
          <div class="form-group">
            <label for="exportEndDate">To</label>
            <input type="date" id="exportEndDate" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="exportActorFilter">Actor</label>
            <select id="exportActorFilter">
              <option value="ALL">All Actors</option>
              <option value="Owner">Owner</option>
              <option value="Staff">Staff</option>
              <option value="Customer">Customer</option>
            </select>
          </div>
          <div class="form-group">
            <label for="exportActionFilter">Action</label>
            <select id="exportActionFilter">
              <option value="ALL">All Actions</option>
            </select>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelExportAuditBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Download PDF</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/constants.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/activityLog.js"></script>
  <script src="js/auth.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/pageActivityLog.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — Grea San Jave</title>
    <link rel="stylesheet" href="css/anika.css">
</head>

<body>
    <div id="toastContainer" aria-live="polite"></div>
    <header class="app-header">
        <div class="brand"><img src="../grea_logo.jpg" alt="Grea San Jave logo"><span class="brand-text"><span
                    class="secondary">Grea</span> San <span class="accent">Jave</span></span></div>
        <nav class="app-nav"><a id="dashboardNav" href="#">Dashboard</a><a id="customerNav" href="customer-list.html"
                style="display:none">Customers</a><a id="adminNav" href="account-management.html"
                style="display:none">Account Management</a><a id="auditNav" href="activity-log.html"
                style="display:none">Audit Trail</a><a href="profile.html" class="active">My
                Profile</a></nav>
        <div class="session-info"><span id="currentUserLabel"></span><button id="logoutBtn"
                class="btn btn-secondary btn-small">Log Out</button></div>
    </header>
    <main>
        <h1 class="page-title">My Profile</h1>
        <div class="card">
            <form id="profileForm">
                <div class="form-row">
                    <div class="form-group"><label for="profileName">Name</label><input id="profileName" type="text"
                            required>
                        <div class="field-error" id="profileNameError"></div>
                    </div>
                    <div class="form-group"><label for="profileUsername">Username</label><input id="profileUsername"
                            type="text" required>
                        <div class="field-error" id="profileUsernameError"></div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label for="profileEmail">Email</label><input id="profileEmail" type="email"
                            required>
                        <div class="field-error" id="profileEmailError"></div>
                    </div>
                    <div class="form-group" id="messengerGroup"><label for="profileMessenger">Messenger
                            Handle</label><input id="profileMessenger" type="text">
                        <div class="field-error" id="profileMessengerError"></div>
                    </div>
                </div><button class="btn btn-primary" type="submit">Save Profile</button>
            </form>
        </div>
        <div class="card">
            <h2 class="card-title">Change Password</h2>
            <form id="passwordForm">
                <div class="form-row">
                    <div class="form-group"><label for="currentPassword">Current Password</label><input
                            id="currentPassword" type="password" required></div>
                    <div class="form-group"><label for="newPassword">New Password</label><input id="newPassword"
                            type="password" required>
                        <div class="field-hint">Minimum 8 characters.</div>
                    </div>
                    <div class="form-group"><label for="confirmPassword">Confirm New Password</label><input
                            id="confirmPassword" type="password" required></div>
                </div><button class="btn btn-secondary" type="submit">Change Password</button>
            </form>
            <div id="passwordOtpPanel" class="card" style="display:none; margin-top:1rem;">
                <h3 class="card-title">Verify Password Change</h3>
                <div class="dev-note" id="passwordOtpNote">A verification code will be sent to your registered email.</div>
                <form id="passwordOtpForm">
                    <div class="form-group"><label for="passwordOtpInput">6-digit code</label><input id="passwordOtpInput"
                            type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required></div>
                    <button class="btn btn-primary" type="submit">Verify OTP</button>
                    <button class="btn btn-secondary" id="cancelPasswordOtpBtn" type="button">Cancel</button>
                </form>
            </div>
        </div>
    </main>
    <script src="js/constants.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/activityLog.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="js/emailService.js"></script>
    <script src="js/profilePage.js"></script>
</body>

</html>

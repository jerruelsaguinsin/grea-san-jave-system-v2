<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — Grea San Jave</title>
    <link rel="stylesheet" href="css/anika.css">
</head>

<body>
    <div id="toastContainer" aria-live="polite"></div>
    <main class="auth-shell">
        <div class="auth-card">
            <div class="auth-logo"><img src="../grea_logo.jpg" alt="Grea San Jave logo">
                <h1>Change Your Password</h1>
                <p class="page-subtitle">Your staff account was created with a temporary password. You must create a new
                    password before continuing.</p>
            </div>
            <form id="forcedPasswordForm">
                <div class="form-group"><label for="temporaryPassword">Current / Temporary Password</label><input
                        id="temporaryPassword" type="password" required></div>
                <div class="form-group"><label for="forcedNewPassword">New Password</label><input id="forcedNewPassword"
                        type="password" required>
                    <div class="field-hint">Minimum 8 characters.</div>
                </div>
                <div class="form-group"><label for="forcedConfirmPassword">Confirm New Password</label><input
                        id="forcedConfirmPassword" type="password" required></div><button
                    class="btn btn-primary btn-block" type="submit">Set New Password</button>
            </form><button id="forcedLogoutBtn" class="btn btn-secondary btn-block" style="margin-top:.75rem">Log
                Out</button>
        </div>
    </main>
    <script src="js/constants.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/activityLog.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/changePasswordPage.js"></script>
</body>

</html>

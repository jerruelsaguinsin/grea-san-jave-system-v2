<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer List — Grea San Jave</title>
    <link rel="stylesheet" href="css/anika.css">
</head>

<body>
    <div id="toastContainer" aria-live="polite"></div>
    <header class="app-header">
        <div class="brand"><img src="../grea_logo.jpg" alt="Grea San Jave logo"><span class="brand-text"><span
                    class="secondary">Grea</span> San <span class="accent">Jave</span></span></div>
        <nav class="app-nav"><a id="dashboardNav" href="#">Dashboard</a><a href="customer-list.html"
                class="active">Customers</a><a href="profile.html">My Profile</a></nav>
        <div class="session-info"><span id="currentUserLabel"></span><button id="logoutBtn"
                class="btn btn-secondary btn-small">Log Out</button></div>
    </header>
    <main>
        <h1 class="page-title">Customer List</h1>
        <div class="card">
            <div class="toolbar">
                <div class="form-group" style="flex:2;min-width:220px"><label for="customerSearch">Search</label><input
                        id="customerSearch" type="search" placeholder="Search name, username, email, Messenger...">
                </div>
            </div>
        </div>
        <div class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Messenger</th>
                            <th>Suki</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="customerBody"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="js/constants.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/activityLog.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/customerListPage.js"></script>
</body>

</html>

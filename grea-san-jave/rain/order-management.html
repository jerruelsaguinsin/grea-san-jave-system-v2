/* --------------------------------------------------------------------------
   1. SHARED CONSTANTS (constants.js) — copied verbatim, only the ones this
      module uses. Nothing is added to or changed from that file.
   -------------------------------------------------------------------------- */

var SERVICE_TYPES = {
    DOCUMENT_PRINTING: "Document Printing",
    BOOKBINDING: "Bookbinding"
};

var SERVICE_OPTIONS = {
    SPIRAL_BINDING: "Spiral Binding",
    PERFECT_BINDING: "Perfect Binding",
    LAMINATION: "Lamination",
    NONE: "None"
};

var PROMO_TYPES = {
    NONE: "None",
    BULK_DISCOUNT: "Bulk Discount",
    REGULAR_CUSTOMER_DISCOUNT: "Regular Customer Discount",
    SEASONAL_PROMO: "Seasonal Promo"
};

var COLOR_TIERS = {
    BLACK_TEXT: "Black Text",
    MINIMAL_COLOR: "Minimal Color",
    SMALL_IMAGE: "Small Image",
    FULL_COLOR: "Full Color"
};

var PRICE_PER_PAGE = {};
PRICE_PER_PAGE[COLOR_TIERS.BLACK_TEXT] = 3;
PRICE_PER_PAGE[COLOR_TIERS.MINIMAL_COLOR] = 5;
PRICE_PER_PAGE[COLOR_TIERS.SMALL_IMAGE] = 10;
PRICE_PER_PAGE[COLOR_TIERS.FULL_COLOR] = 20;

var ORDER_CHANNELS = {
    MESSENGER: "Messenger",
    EMAIL: "Email",
    WALK_IN: "Walk-in",
    BLUETOOTH: "Bluetooth"
};

var QUEUE_TYPES = {
    WALK_IN: "walkIn",
    ADVANCE: "advance"
};

var ORDER_STATUS = {
    QUEUED: "queued",
    PRINTING: "printing",
    DONE: "done",
    UNCLAIMED: "unclaimed",
    CANCELLED: "cancelled"
};

var NOTIFICATION_TYPES = {
    UNCLAIMED_ORDER: "UnclaimedOrder",
    LOW_STOCK: "LowStock",
    // TEAM: add these three to constants.js as well — SCHEMA_AND_MODULE_MAP.md
    // already lists them as Module 5's triggers
    NEW_ORDER: "NewOrder",
    RUSH_ORDER: "RushOrder",
    ORDER_READY: "OrderReady"
};

// Copied from constants.js — Module 5 only *initializes* paymentStatus;
// Module 7 owns it from there.
var PAYMENT_STATUS = {
    PENDING: "pending",
    DOWN_PAYMENT_PAID: "downPaymentPaid",
    FULLY_PAID: "fullyPaid"
};

// Placeholder in constants.js — confirm the real number with the client
var UNCLAIMED_THRESHOLD_DAYS = 3;


/* --------------------------------------------------------------------------
   1b. MODULE-LOCAL VALUES (not domain categories, so not in constants.js)
   -------------------------------------------------------------------------- */

var MILLISECONDS_PER_DAY = 86400000;
var LANE_CAPACITY = 100;   // max waiting orders per lane (circular queue size)

// options offered per service (Module 5 intake rule)
var OPTIONS_FOR_SERVICE = {};
OPTIONS_FOR_SERVICE[SERVICE_TYPES.DOCUMENT_PRINTING] = [SERVICE_OPTIONS.NONE, SERVICE_OPTIONS.LAMINATION];
OPTIONS_FOR_SERVICE[SERVICE_TYPES.BOOKBINDING] = [SERVICE_OPTIONS.SPIRAL_BINDING, SERVICE_OPTIONS.PERFECT_BINDING];


/* --------------------------------------------------------------------------
   2. DATA STRUCTURES (built by hand — see course rules above)
   -------------------------------------------------------------------------- */

/* ---- Linked list (Week 6): holds every order, newest first ---- */

// builds an empty linked list
function createLinkedList() {
    return { head: null, size: 0 };
}

// adds a value at the front, so the newest order is always the head
function linkedListInsertAtHead(listRef, itemValue) {

    var newNode = { value: itemValue, next: listRef.head };

    listRef.head = newNode;
    listRef.size = listRef.size + 1;

}

// walks the nodes until it finds the order with this orderId
function linkedListFindOrder(listRef, targetOrderId) {

    var currentNode = listRef.head;

    while (currentNode !== null) {

        if (currentNode.value.orderId === targetOrderId) {
            return currentNode.value;
        }

        currentNode = currentNode.next;

    }

    return null;

}

/* ---- Circular queue (Week 7): one per lane, strict first-in first-out ---- */

// builds an empty circular queue with fixed capacity
function createCircularQueue(capacityNumber) {

    var slotsData = [];
    var slotIndex;

    for (slotIndex = 0; slotIndex < capacityNumber; slotIndex++) {
        slotsData[slotIndex] = null;
    }

    return { slots: slotsData, capacity: capacityNumber, front: 0, rear: -1, count: 0 };

}

function queueIsEmpty(queueRef) {
    return queueRef.count === 0;
}

function queueIsFull(queueRef) {
    return queueRef.count === queueRef.capacity;
}

// adds at the rear, wrapping around with modulo; returns false when full
function queueEnqueue(queueRef, itemValue) {

    if (queueIsFull(queueRef)) {
        return false;
    }

    queueRef.rear = (queueRef.rear + 1) % queueRef.capacity;
    queueRef.slots[queueRef.rear] = itemValue;
    queueRef.count = queueRef.count + 1;

    return true;

}

// removes from the front, wrapping around with modulo; returns null when empty
function queueDequeue(queueRef) {

    if (queueIsEmpty(queueRef)) {
        return null;
    }

    var frontItem = queueRef.slots[queueRef.front];

    queueRef.slots[queueRef.front] = null;
    queueRef.front = (queueRef.front + 1) % queueRef.capacity;
    queueRef.count = queueRef.count - 1;

    return frontItem;

}

// looks at the front without removing it
function queuePeek(queueRef) {

    if (queueIsEmpty(queueRef)) {
        return null;
    }

    return queueRef.slots[queueRef.front];

}

// reads the item that is offsetFromFront places behind the front (0 = front)
function queueItemAt(queueRef, offsetFromFront) {
    return queueRef.slots[(queueRef.front + offsetFromFront) % queueRef.capacity];
}

// takes one specific item out of the middle (a cancelled order) while keeping
// everyone else in the same order: dequeue all, enqueue back all except the target
function queueRemoveItem(queueRef, targetItem) {

    var originalCount = queueRef.count;
    var stepIndex;

    for (stepIndex = 0; stepIndex < originalCount; stepIndex++) {

        var movedItem = queueDequeue(queueRef);

        if (movedItem !== targetItem) {
            queueEnqueue(queueRef, movedItem);
        }

    }

}

// 1-based place of an item in the queue, 0 when it is not in it
function queuePositionOf(queueRef, targetItem) {

    var offsetIndex;

    for (offsetIndex = 0; offsetIndex < queueRef.count; offsetIndex++) {
        if (queueItemAt(queueRef, offsetIndex) === targetItem) {
            return offsetIndex + 1;
        }
    }

    return 0;

}

/* ---- Stack: notifications, newest on top ---- */

// builds an empty stack
function createStack() {
    return { stackData: [], stackCount: 0 };
}

// puts a value on top
function stackPush(stackRef, itemValue) {
    stackRef.stackData[stackRef.stackCount] = itemValue;
    stackRef.stackCount = stackRef.stackCount + 1;
}

// reads an item counting down from the top (0 = newest)
function stackGetFromTop(stackRef, offsetFromTop) {
    return stackRef.stackData[stackRef.stackCount - 1 - offsetFromTop];
}

/* ---- Small search helpers ---- */

// text search without String.indexOf
function manualTextContains(sourceText, targetText) {

    if (targetText === "") {
        return true;
    }

    if (targetText.length > sourceText.length) {
        return false;
    }

    var startIndex;
    var offsetIndex;
    var matches;

    for (startIndex = 0; startIndex <= sourceText.length - targetText.length; startIndex++) {

        matches = true;

        for (offsetIndex = 0; offsetIndex < targetText.length; offsetIndex++) {
            if (sourceText[startIndex + offsetIndex] !== targetText[offsetIndex]) {
                matches = false;
                break;
            }
        }

        if (matches) {
            return true;
        }

    }

    return false;

}

// linear search on a plain array of strings
function arrayContainsValue(sourceArray, targetValue) {

    var index;

    for (index = 0; index < sourceArray.length; index++) {
        if (sourceArray[index] === targetValue) {
            return true;
        }
    }

    return false;

}


/* --------------------------------------------------------------------------
   3. STATE
   -------------------------------------------------------------------------- */

var ordersList = createLinkedList();                       // every order, newest first
var walkInQueue = createCircularQueue(LANE_CAPACITY);      // QUEUE_TYPES.WALK_IN
var advanceQueue = createCircularQueue(LANE_CAPACITY);     // QUEUE_TYPES.ADVANCE (rush)
var notificationsStack = createStack();                    // newest on top

var nextOrderId = 1;
var nextNotificationId = 1;
var dayOffset = 0;                                         // "Skip 1 day" adds here

var lastFocusedElement = null;


/* --------------------------------------------------------------------------
   3b. SHARED STORE (window.GSJ_STORE) — the bridge other modules attach to.
       Module 5 owns the Order linked list and both lane queues; other modules
       must never touch the nodes or queue slots directly, only through these
       functions. Module 4 is the first subscriber.
   -------------------------------------------------------------------------- */

var sharedStore = {

    // READ access to orders (used by Module 4's linked-order dropdown)
    findOrderById: function (targetOrderId) {
        return linkedListFindOrder(ordersList, targetOrderId);
    },

    // walks every order without exposing the nodes (Week 6 stays internal)
    walkOrders: function (visitFunction) {
        var currentNode = ordersList.head;
        while (currentNode !== null) {
            visitFunction(currentNode.value);
            currentNode = currentNode.next;
        }
    },

    // display helpers so Module 4 formats IDs and timestamps identically
    formatOrderId: formatOrderId,
    nowIso: shopNowIso,

    // "order reached DONE" subscribers — a hand-built linked list of handlers.
    // Module 4 registers here to auto-dispose stored files (data privacy).
    orderDoneHandlers: createLinkedList(),

    registerOrderDoneHandler: function (handlerFunction) {
        linkedListInsertAtHead(sharedStore.orderDoneHandlers, handlerFunction);
    },

    emitOrderDone: function (finishedOrder) {

        var currentNode = sharedStore.orderDoneHandlers.head;

        while (currentNode !== null) {
            currentNode.value(finishedOrder);
            currentNode = currentNode.next;
        }

    },

    // fileBridge — registered by Module 4 so this module can render each
    // order's live file status; null until Module 4 loads
    fileBridge: null,

    registerFileBridge: function (bridgeObject) {
        sharedStore.fileBridge = bridgeObject;
    },

    // lets dependent modules (Module 4) ask for a re-render after they
    // write their fields onto an Order record
    requestRender: function () {
        renderAll();
    }

};

window.GSJ_STORE = sharedStore;


/* --------------------------------------------------------------------------
   4. ELEMENT REFERENCES
   -------------------------------------------------------------------------- */

var orderModal          = document.getElementById("order-modal");
var orderTableBody      = document.getElementById("order-table-body");
var notificationListEl  = document.getElementById("notification-list");
var searchInput         = document.getElementById("search-input");
var nextButton          = document.getElementById("next-btn");
var queueHint           = document.getElementById("queue-hint");

var customerNameInput   = document.getElementById("customerName");
var subjectInput        = document.getElementById("subject");
var serviceTypeInput    = document.getElementById("serviceType");
var serviceOptionInput  = document.getElementById("serviceOption");
var paperSizeInput      = document.getElementById("paperSize");
var colorTierInput      = document.getElementById("colorTier");
var fileChannelInput    = document.getElementById("fileChannel");
var pagesInput          = document.getElementById("pages");
var copiesInput         = document.getElementById("copies");
var isRushInput         = document.getElementById("isRush");
var notesInput          = document.getElementById("notes");
var ratePreview         = document.getElementById("rate-preview");
var totalPreview        = document.getElementById("total-preview");
var orderError          = document.getElementById("order-error");


/* --------------------------------------------------------------------------
   5. TEXT, NUMBER & TIME HELPERS
   -------------------------------------------------------------------------- */

// pads a number with zeros
function padLeft(rawValue, targetWidth) {

    var textValue = String(rawValue);

    while (textValue.length < targetWidth) {
        textValue = "0" + textValue;
    }

    return textValue;

}

// builds ORD-000N display id
function formatOrderId(orderIdNumber) {
    return "ORD-" + padLeft(orderIdNumber, 4);
}

// builds a peso amount
function formatPeso(amountNumber) {
    return "₱" + amountNumber.toLocaleString("en-PH");
}

// shop time in milliseconds, including skipped days
function shopNowMs() {
    return Date.now() + dayOffset * MILLISECONDS_PER_DAY;
}

// shop time as ISO 8601 (date* fields)
function shopNowIso() {
    return new Date(shopNowMs()).toISOString();
}

// readable stamp from an ISO string
function formatStamp(isoText) {
    return new Date(isoText).toLocaleString("en-PH", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

// fills a select from a constants object
function populateSelect(selectElement, valuesObject) {

    var keyName;

    for (keyName in valuesObject) {

        var optionElement = document.createElement("option");
        optionElement.value = valuesObject[keyName];
        optionElement.textContent = valuesObject[keyName];
        selectElement.appendChild(optionElement);

    }

}


/* --------------------------------------------------------------------------
   6. PRICING & VALIDATION (intake)
   -------------------------------------------------------------------------- */

// baseTotalPrice = pricePerPage x pages x copies
// (the client gave no surcharge for binding/lamination, so none is added)
function calculateBasePrice(colorTierText, pageCount, copyCount) {
    return PRICE_PER_PAGE[colorTierText] * pageCount * copyCount;
}

// MODULE 10 HOOK — Promotions is not built yet, so no promo ever applies.
// When it exists, look up the active promo here and return its type and amount.
function applyPromo(baseTotalPrice) {
    return { promoType: PROMO_TYPES.NONE, discountAmount: 0 };
}

// returns an error message, or "" when the order is valid
function validateOrder(orderRecord) {

    if (!orderRecord.customerName) {
        return "Enter the customer name.";
    }

    if (!orderRecord.paperSize) {
        return "Enter the paper size.";
    }

    if (!Number.isInteger(orderRecord.pages) || orderRecord.pages < 1) {
        return "Pages must be a whole number of 1 or more.";
    }

    if (!Number.isInteger(orderRecord.copies) || orderRecord.copies < 1) {
        return "Copies must be a whole number of 1 or more.";
    }

    // every enum field is checked against the constants, never trusted blindly
    var validServiceTypes = [SERVICE_TYPES.DOCUMENT_PRINTING, SERVICE_TYPES.BOOKBINDING];
    if (!arrayContainsValue(validServiceTypes, orderRecord.serviceType)) {
        return "Pick a valid service.";
    }

    var allowedOptions = OPTIONS_FOR_SERVICE[orderRecord.serviceType];
    if (!allowedOptions || !arrayContainsValue(allowedOptions, orderRecord.serviceOption)) {
        return "That option is not offered for this service.";
    }

    var validTiers = [COLOR_TIERS.BLACK_TEXT, COLOR_TIERS.MINIMAL_COLOR,
                      COLOR_TIERS.SMALL_IMAGE, COLOR_TIERS.FULL_COLOR];
    if (!arrayContainsValue(validTiers, orderRecord.colorTier)) {
        return "Pick a valid color tier.";
    }

    var validChannels = [ORDER_CHANNELS.MESSENGER, ORDER_CHANNELS.EMAIL,
                         ORDER_CHANNELS.WALK_IN, ORDER_CHANNELS.BLUETOOTH];
    if (!arrayContainsValue(validChannels, orderRecord.fileChannel)) {
        return "Pick a valid receiving channel.";
    }

    return "";

}


/* --------------------------------------------------------------------------
   7. QUEUE RULES
   -------------------------------------------------------------------------- */

// picks the lane queue for a queueType
function getLaneQueue(queueTypeText) {
    return queueTypeText === QUEUE_TYPES.ADVANCE ? advanceQueue : walkInQueue;
}

// the order that must print next: rush lane first, otherwise the walk-in lane.
// Inside a lane it is always the front, so no order can skip an earlier one.
function getNextUpOrder() {

    if (!queueIsEmpty(advanceQueue)) {
        return queuePeek(advanceQueue);
    }

    return queuePeek(walkInQueue);

}

// how many orders are waiting across both lanes
function getWaitingCount() {
    return advanceQueue.count + walkInQueue.count;
}


/* --------------------------------------------------------------------------
   8. ALERTS (notification triggers this module fires)
   -------------------------------------------------------------------------- */

function addNotification(typeText, relatedOrderIdNumber, messageText, recipientTypeText) {

    stackPush(notificationsStack, {
        notificationId: nextNotificationId,
        type: typeText,
        relatedOrderId: relatedOrderIdNumber,
        relatedItemId: null,
        isBroadcast: false,
        recipientType: recipientTypeText,   // "Staff" | "Customer" | "Both"
        message: messageText,
        isRead: false,
        dateCreated: shopNowIso()
    });

    nextNotificationId = nextNotificationId + 1;

}


/* --------------------------------------------------------------------------
   9. ORDER ACTIONS
   -------------------------------------------------------------------------- */

// reads the form, validates, prices, and puts the order in its lane
function saveOrder() {

    var newOrder = {
        orderId: nextOrderId,
        customerId: null,                       // walk-in customers may have no account
        customerName: customerNameInput.value.trim(),
        subject: subjectInput.value.trim(),
        notes: notesInput.value.trim(),
        serviceType: serviceTypeInput.value,
        serviceOption: serviceOptionInput.value,
        paperSize: paperSizeInput.value.trim(),
        colorTier: colorTierInput.value,
        pages: Number(pagesInput.value),
        copies: Number(copiesInput.value),
        fileChannel: fileChannelInput.value,
        isRush: isRushInput.checked
    };

    var errorText = validateOrder(newOrder);

    if (errorText === "") {

        newOrder.queueType = newOrder.isRush ? QUEUE_TYPES.ADVANCE : QUEUE_TYPES.WALK_IN;

        if (queueIsFull(getLaneQueue(newOrder.queueType))) {
            errorText = "The " + (newOrder.isRush ? "rush" : "walk-in") + " lane is full. Finish or cancel an order first.";
        }

    }

    orderError.textContent = errorText;

    if (errorText !== "") {
        return;
    }

    var promoResult;

    newOrder.status = ORDER_STATUS.QUEUED;
    newOrder.pricePerPage = PRICE_PER_PAGE[newOrder.colorTier];
    newOrder.baseTotalPrice = calculateBasePrice(newOrder.colorTier, newOrder.pages, newOrder.copies);

    promoResult = applyPromo(newOrder.baseTotalPrice);
    newOrder.promoType = promoResult.promoType;
    newOrder.discountAmount = promoResult.discountAmount;
    newOrder.totalPrice = newOrder.baseTotalPrice - newOrder.discountAmount;

    // schema defaults for fields owned by other modules (4, 7, 10) so nobody
    // ever reads undefined off an Order this module created
    newOrder.fileName = null;              // Module 4 fills this in
    newOrder.fileCount = 0;
    newOrder.priorityLevel = null;
    newOrder.promoId = null;               // Module 10 hook in applyPromo fills this
    newOrder.requiresDownPayment = false;
    newOrder.downPaymentAmount = 0;
    newOrder.paymentMethod = null;
    newOrder.paymentStatus = PAYMENT_STATUS.PENDING;   // Module 7 owns it from here
    newOrder.proofOfPaymentFile = null;
    newOrder.fileDisposed = false;         // Module 4 flips this on Done
    newOrder.dateDisposed = null;

    newOrder.dateAdded = shopNowIso();
    newOrder.dateCompleted = null;
    newOrder.unclaimedReason = null;
    newOrder.daysUnclaimed = null;

    nextOrderId = nextOrderId + 1;
    linkedListInsertAtHead(ordersList, newOrder);
    queueEnqueue(getLaneQueue(newOrder.queueType), newOrder);

    // MODULE 3 HOOK — log the order submission here once Module 3 exists.

    // Module 16 hook: a new order alerts the owner; a rush order adds an
    // urgent alert on top of the regular one
    addNotification(NOTIFICATION_TYPES.NEW_ORDER, newOrder.orderId,
        "Order " + formatOrderId(newOrder.orderId) + " (" + newOrder.customerName +
        ") added to the " + (newOrder.isRush ? "rush" : "walk-in") + " lane", "Staff");

    if (newOrder.isRush) {
        addNotification(NOTIFICATION_TYPES.RUSH_ORDER, newOrder.orderId,
            "Rush order " + formatOrderId(newOrder.orderId) + " (" + newOrder.customerName +
            ") needs urgent printing", "Staff");
    }

    closeOrderModal();
    commitChanges();

}

// takes the next-up order out of its lane and starts printing it
function startNextOrder() {

    var nextUpOrder = getNextUpOrder();

    if (nextUpOrder === null) {
        return;
    }

    queueDequeue(getLaneQueue(nextUpOrder.queueType));
    setOrderStatus(nextUpOrder, ORDER_STATUS.PRINTING);
    commitChanges();

}

// Queued or Unclaimed -> Cancelled. A queued order leaves its lane; the others keep their places.
function cancelOrder(targetOrder) {

    if (targetOrder.status === ORDER_STATUS.QUEUED) {
        queueRemoveItem(getLaneQueue(targetOrder.queueType), targetOrder);
    }

    setOrderStatus(targetOrder, ORDER_STATUS.CANCELLED);
    commitChanges();

}

// moves an order to a new status and fires the matching trigger
function setOrderStatus(targetOrder, newStatusText) {

    targetOrder.status = newStatusText;

    if (newStatusText === ORDER_STATUS.DONE) {

        targetOrder.dateCompleted = shopNowIso();
        targetOrder.daysUnclaimed = 0;

        // Module 16 hook: tell the customer their order is ready for pickup
        addNotification(NOTIFICATION_TYPES.ORDER_READY, targetOrder.orderId,
            "Order " + formatOrderId(targetOrder.orderId) + " (" + targetOrder.customerName +
            ") is ready for pickup", "Customer");

        // MODULE 4 DEPENDENCY: the order is Done, so its stored print files
        // must be disposed NOW (schema: Module 4 auto-disposes once
        // Order.status === ORDER_STATUS.DONE — the "data privacy is key"
        // requirement). Every module that registered a handler (Module 4)
        // runs it before this function returns.
        sharedStore.emitOrderDone(targetOrder);

    }

    // MODULE 3 HOOK — log the status change here once Module 3 exists.

}

// updates daysUnclaimed on every finished order and flags the ones past the threshold
function checkUnclaimedOrders() {

    var currentNode = ordersList.head;

    while (currentNode !== null) {

        var currentOrder = currentNode.value;

        if (currentOrder.status === ORDER_STATUS.DONE || currentOrder.status === ORDER_STATUS.UNCLAIMED) {

            var elapsedMs = shopNowMs() - Date.parse(currentOrder.dateCompleted);
            currentOrder.daysUnclaimed = Math.floor(elapsedMs / MILLISECONDS_PER_DAY);

            if (currentOrder.status === ORDER_STATUS.DONE && elapsedMs > UNCLAIMED_THRESHOLD_DAYS * MILLISECONDS_PER_DAY) {

                setOrderStatus(currentOrder, ORDER_STATUS.UNCLAIMED);
                currentOrder.unclaimedReason = "Not picked up after " + UNCLAIMED_THRESHOLD_DAYS + " days";

                addNotification(NOTIFICATION_TYPES.UNCLAIMED_ORDER, currentOrder.orderId,
                    "Order " + formatOrderId(currentOrder.orderId) + " (" + currentOrder.customerName +
                    ") has waited over " + UNCLAIMED_THRESHOLD_DAYS + " days", "Staff");

            }

        }

        currentNode = currentNode.next;

    }

}

// re-checks unclaimed orders, then redraws everything
function commitChanges() {
    checkUnclaimedOrders();
    renderAll();
    saveSnapshot();
}

// wipes all in-memory data
function clearAllData() {

    ordersList = createLinkedList();
    walkInQueue = createCircularQueue(LANE_CAPACITY);
    advanceQueue = createCircularQueue(LANE_CAPACITY);
    notificationsStack = createStack();
    nextOrderId = 1;
    nextNotificationId = 1;
    dayOffset = 0;
    try { localStorage.removeItem(SNAPSHOT_KEY); } catch (ignoreError) {}
    searchInput.value = "";

    // MODULE 4 DEPENDENCY: tell it the orders it linked files to are gone,
    // so its table can mark them instead of pointing at stale records
    if (sharedStore.fileBridge !== null && sharedStore.fileBridge.onStoreReset) {
        sharedStore.fileBridge.onStoreReset();
    }

    commitChanges();

}


/* --------------------------------------------------------------------------
   10. RENDERING
   -------------------------------------------------------------------------- */

// redraws stats, table, queue button, feed, and clock

function renderAll() {
    renderStats();
    renderTable();
    renderNotifications();

    var nextUpOrder = getNextUpOrder();
    nextButton.disabled = nextUpOrder === null;
    nextButton.textContent = nextUpOrder
        ? "Start next: " + formatOrderId(nextUpOrder.orderId)
        : "Queue is empty";

    queueHint.textContent =
        "Rush lane: " + advanceQueue.count +
        " waiting · Walk-in lane: " + walkInQueue.count +
        " waiting";

    var clockElement = document.getElementById("clock");
    if (clockElement) {
        clockElement.textContent = "Shop time: " + formatStamp(shopNowIso());
    }
}
// recomputes the five stat cards
function renderStats() {

    var startOfToday = new Date(shopNowMs());
    startOfToday.setHours(0, 0, 0, 0);
    var startOfTodayMs = startOfToday.getTime();

    var ordersTodayCount = 0;
    var revenueToday = 0;
    var unclaimedCount = 0;

    var currentNode = ordersList.head;

    while (currentNode !== null) {

        var currentOrder = currentNode.value;

        if (Date.parse(currentOrder.dateAdded) >= startOfTodayMs) {
            ordersTodayCount = ordersTodayCount + 1;
            if (currentOrder.status !== ORDER_STATUS.CANCELLED) {
                revenueToday = revenueToday + currentOrder.totalPrice;
            }
        }

        if (currentOrder.status === ORDER_STATUS.UNCLAIMED) {
            unclaimedCount = unclaimedCount + 1;
        }

        currentNode = currentNode.next;

    }

    document.getElementById("stat-today").textContent = ordersTodayCount;
    document.getElementById("stat-revenue").textContent = formatPeso(revenueToday);
    document.getElementById("stat-queue").textContent = getWaitingCount();
    document.getElementById("stat-lowstock").textContent = 0;      // Module 6 not built yet
    document.getElementById("stat-unclaimed").textContent = unclaimedCount;

}

// redraws the order table (newest first, because the list is built that way), filtered by search
function renderTable() {

    orderTableBody.textContent = "";

    var queryText = searchInput.value.trim().toLowerCase();
    var nextUpOrder = getNextUpOrder();
    var shownCount = 0;

    var currentNode = ordersList.head;

    while (currentNode !== null) {

        var currentOrder = currentNode.value;

        var haystackText = (
            formatOrderId(currentOrder.orderId) + " " + currentOrder.customerName + " " +
            currentOrder.subject + " " + currentOrder.serviceType + " " + currentOrder.serviceOption + " " +
            currentOrder.paperSize + " " + currentOrder.colorTier + " " + currentOrder.status + " " +
            (currentOrder.fileName === null ? "" : currentOrder.fileName) + " " +
            (currentOrder.isRush ? "rush" : "walk-in")
        ).toLowerCase();

        if (manualTextContains(haystackText, queryText)) {
            orderTableBody.appendChild(buildOrderRow(currentOrder, nextUpOrder));
            shownCount = shownCount + 1;
        }

        currentNode = currentNode.next;

    }

    if (shownCount === 0) {

        var emptyRow = document.createElement("tr");
        emptyRow.className = "empty-row";

        var emptyCell = document.createElement("td");
        emptyCell.colSpan = 9;
        emptyCell.textContent = ordersList.size === 0 ? "No orders yet. Add the first one." : "No orders match your search.";

        emptyRow.appendChild(emptyCell);
        orderTableBody.appendChild(emptyRow);

    }

}

// builds a plain text cell
function buildTextCell(cellValueText, labelText) {

    var textCell = document.createElement("td");
    textCell.setAttribute("data-label", labelText);
    textCell.textContent = cellValueText;

    return textCell;

}

// builds the File column by asking Module 4 (via the registered fileBridge)
// for this order's live file summary — Module 5 never stores file rows itself
function buildFileCell(orderRecord) {

    var fileCell = document.createElement("td");
    fileCell.setAttribute("data-label", "File (Module 4)");

    if (sharedStore.fileBridge === null) {
        // MODULE 4 DEPENDENCY (bidirectional): Module 4 lives in its own file.
        // When it is not on this page, fall back to the shared snapshot it
        // writes to localStorage so the File column stays live cross-tab.
        var snapshotFileSummary = getSnapshotFileSummary(orderRecord.orderId);
        if (snapshotFileSummary === null) {
            fileCell.textContent = "No file yet";
            return fileCell;
        }
        var snapshotBadge = document.createElement("span");
        if (snapshotFileSummary.fileDisposed) {
            snapshotBadge.className = "badge badge-inactive";
            snapshotBadge.textContent = "Disposed";
            snapshotBadge.title = snapshotFileSummary.fileName + " — disposed per data-privacy rule";
        } else {
            snapshotBadge.className = "badge badge-active";
            snapshotBadge.textContent = "Valid";
            snapshotBadge.title = snapshotFileSummary.fileName;
        }
        fileCell.appendChild(snapshotBadge);
        fileCell.appendChild(document.createTextNode(" " + snapshotFileSummary.fileName));
        return fileCell;
    }

    var fileSummary = sharedStore.fileBridge.getFileSummary(orderRecord.orderId);

    if (fileSummary === null) {
        fileCell.textContent = "No file yet";       // staff can still attach one via Module 4
        return fileCell;
    }

    var fileBadge = document.createElement("span");

    if (fileSummary.fileDisposed) {
        fileBadge.className = "badge badge-inactive";
        fileBadge.textContent = "Disposed";
        fileBadge.title = fileSummary.fileName + " — disposed per data-privacy rule";
    } else if (fileSummary.validationResult === "Valid") {
        fileBadge.className = "badge badge-active";
        fileBadge.textContent = "Valid";
        fileBadge.title = fileSummary.fileName;
    } else {
        fileBadge.className = "badge badge-inactive";
        fileBadge.textContent = fileSummary.validationResult;
        fileBadge.title = fileSummary.fileName + " — " + fileSummary.flagReasonText;
    }

    fileCell.appendChild(fileBadge);

    var nameText = document.createTextNode(" " + fileSummary.fileName);
    fileCell.appendChild(nameText);

    return fileCell;

}

// builds a row-action button
function buildActionButton(labelText, classText, isDisabled, disabledHintText, onClickHandler) {

    var buttonElement = document.createElement("button");
    buttonElement.type = "button";
    buttonElement.className = "btn " + classText + " btn-small";
    buttonElement.textContent = labelText;
    buttonElement.style.whiteSpace = "nowrap";
    buttonElement.disabled = isDisabled;

    if (isDisabled) {
        buttonElement.title = disabledHintText;
    }

    buttonElement.addEventListener("click", onClickHandler);

    return buttonElement;

}

// builds one order table row
function buildOrderRow(orderRecord, nextUpOrder) {

    var orderRow = document.createElement("tr");
    var isNextUp = nextUpOrder !== null && nextUpOrder.orderId === orderRecord.orderId;

    if (isNextUp) {
        orderRow.style.background = "rgba(42, 125, 79, 0.14)";
    }

    var laneLabel = orderRecord.isRush ? "Rush" : "Walk-in";
    var queueText = laneLabel;

    if (orderRecord.status === ORDER_STATUS.QUEUED) {
        queueText = laneLabel + " #" + queuePositionOf(getLaneQueue(orderRecord.queueType), orderRecord);
    }

    var customerText = orderRecord.customerName;
    if (orderRecord.subject !== "") {
        customerText = customerText + " · " + orderRecord.subject;
    }

    orderRow.appendChild(buildTextCell(formatOrderId(orderRecord.orderId), "Order ID"));
    orderRow.appendChild(buildTextCell(customerText, "Customer"));
    orderRow.appendChild(buildTextCell(orderRecord.serviceType, "Service"));
    orderRow.appendChild(buildTextCell(orderRecord.serviceOption + " · " + orderRecord.paperSize + " · " +
orderRecord.colorTier + " · " + orderRecord.pages + " pages × " + orderRecord.copies + " copies", "Spec"));    orderRow.appendChild(buildFileCell(orderRecord));
    orderRow.appendChild(buildTextCell(queueText, "Queue"));
    orderRow.appendChild(buildTextCell(formatPeso(orderRecord.totalPrice), "Total"));

    var statusCell = document.createElement("td");
    statusCell.setAttribute("data-label", "Status");
    var statusBadge = document.createElement("span");
    var isProblemStatus = orderRecord.status === ORDER_STATUS.CANCELLED || orderRecord.status === ORDER_STATUS.UNCLAIMED;
    statusBadge.className = isProblemStatus ? "badge badge-inactive" : "badge badge-active";
    statusBadge.textContent = orderRecord.status;

    if (orderRecord.status === ORDER_STATUS.UNCLAIMED) {
        statusBadge.textContent = orderRecord.status + " (" + orderRecord.daysUnclaimed + "d)";
        statusBadge.title = orderRecord.unclaimedReason;
    }

    statusCell.appendChild(statusBadge);
    orderRow.appendChild(statusCell);

    var actionsCell = document.createElement("td");
    actionsCell.setAttribute("data-label", "Actions");
    actionsCell.className = "row-actions";
    actionsCell.style.display = "flex";
    actionsCell.style.gap = "6px";

    if (orderRecord.status === ORDER_STATUS.QUEUED) {

        actionsCell.appendChild(buildActionButton("Start", "btn-secondary", !isNextUp,
            "An earlier order or a rush order goes first", startNextOrder));

        actionsCell.appendChild(buildActionButton("Cancel", "btn-danger", false, "", function () {
            cancelOrder(orderRecord);
        }));

    }

    if (orderRecord.status === ORDER_STATUS.PRINTING) {

        actionsCell.appendChild(buildActionButton("Done", "btn-secondary", false, "", function () {
            setOrderStatus(orderRecord, ORDER_STATUS.DONE);
            commitChanges();
        }));

    }

    if (orderRecord.status === ORDER_STATUS.UNCLAIMED) {

        actionsCell.appendChild(buildActionButton("Cancel", "btn-danger", false, "", function () {
            cancelOrder(orderRecord);
        }));

    }

    orderRow.appendChild(actionsCell);

    return orderRow;

}

// builds one feed row
function buildFeedItem(labelText, detailText, timeText) {

    var itemElement = document.createElement("li");
    itemElement.className = "activity-item";

    var labelSpan = document.createElement("span");
    labelSpan.className = "badge badge-role";
    labelSpan.textContent = labelText;

    var detailSpan = document.createElement("span");
    detailSpan.className = "activity-text";
    detailSpan.textContent = detailText;

    var timeSpan = document.createElement("span");
    timeSpan.className = "activity-time";
    timeSpan.textContent = timeText;

    itemElement.appendChild(labelSpan);
    itemElement.appendChild(detailSpan);
    itemElement.appendChild(timeSpan);

    return itemElement;

}

// draws the notification feed, newest first
function renderNotifications() {

    notificationListEl.textContent = "";

    if (notificationsStack.stackCount === 0) {
        notificationListEl.appendChild(buildFeedItem("None", "No alerts yet.", ""));
    }

    var offsetIndex;

    for (offsetIndex = 0; offsetIndex < notificationsStack.stackCount; offsetIndex++) {
        var noteRecord = stackGetFromTop(notificationsStack, offsetIndex);
        notificationListEl.appendChild(buildFeedItem(noteRecord.type, noteRecord.message, formatStamp(noteRecord.dateCreated)));
    }

}


/* --------------------------------------------------------------------------
   11. NEW ORDER DIALOG
   -------------------------------------------------------------------------- */

// rebuilds the option list and price preview from the current form
function syncForm() {

    var allowedOptions = OPTIONS_FOR_SERVICE[serviceTypeInput.value];
    var keepValue = serviceOptionInput.value;
    var index;

    serviceOptionInput.textContent = "";

    for (index = 0; index < allowedOptions.length; index++) {
        var optionElement = document.createElement("option");
        optionElement.value = allowedOptions[index];
        optionElement.textContent = allowedOptions[index];
        serviceOptionInput.appendChild(optionElement);
    }

    if (arrayContainsValue(allowedOptions, keepValue)) {
        serviceOptionInput.value = keepValue;
    }

    var pageCount = Number(pagesInput.value);
    var copyCount = Number(copiesInput.value);

    ratePreview.textContent = formatPeso(PRICE_PER_PAGE[colorTierInput.value]);

    totalPreview.textContent = (pageCount > 0 && copyCount > 0) ?
        formatPeso(calculateBasePrice(colorTierInput.value, pageCount, copyCount)) : "₱0";

}

// opens the dialog with a clean form
function openOrderModal() {

    lastFocusedElement = document.activeElement;

    customerNameInput.value = "";
    subjectInput.value = "";
    paperSizeInput.value = "";
    notesInput.value = "";
    pagesInput.value = 1;
    copiesInput.value = 1;
    isRushInput.checked = false;
    orderError.textContent = "";
    syncForm();

    orderModal.hidden = false;
    orderModal.classList.add("open");
    customerNameInput.focus();

}

// closes the dialog
function closeOrderModal() {

    orderModal.hidden = true;
    orderModal.classList.remove("open");

    if (lastFocusedElement) {
        lastFocusedElement.focus();
    }

}


/* --------------------------------------------------------------------------
   12. EVENTS
   -------------------------------------------------------------------------- */

document.getElementById("add-btn").addEventListener("click", openOrderModal);
document.getElementById("modal-close").addEventListener("click", closeOrderModal);
document.getElementById("cancel-btn").addEventListener("click", closeOrderModal);
document.getElementById("save-btn").addEventListener("click", saveOrder);

document.getElementById("day-btn").addEventListener("click", function () {
    dayOffset = dayOffset + 1;
    commitChanges();
});

document.getElementById("reset-btn").addEventListener("click", clearAllData);

nextButton.addEventListener("click", startNextOrder);

searchInput.addEventListener("input", renderTable);

orderModal.addEventListener("input", syncForm);
orderModal.addEventListener("change", syncForm);

orderModal.addEventListener("click", function (clickEvent) {
    if (clickEvent.target === orderModal) {
        closeOrderModal();
    }
});

document.addEventListener("keydown", function (keyboardEvent) {
    if (keyboardEvent.key === "Escape" && !orderModal.hidden) {
        closeOrderModal();
    }
});

orderModal.addEventListener("keydown", function (keyboardEvent) {

    if (keyboardEvent.key === "Enter" && keyboardEvent.target.type === "text") {
        keyboardEvent.preventDefault();
        saveOrder();
    }

});



/* --------------------------------------------------------------------------
   12b. CROSS-FILE SNAPSHOT (localStorage) — the bidirectional link with
        Module 4 when the two modules run in separate tabs. Module 5 writes
        every order here on commitChanges; Module 4 reads it to fetch order
        serial numbers, and writes file fields back into it. This module
        listens for Module 4's writes and merges the file fields onto the
        live Order records it owns.
   -------------------------------------------------------------------------- */

var SNAPSHOT_KEY = "gsj_orders_snapshot";
var ORDER_ID_HANDOFF_KEY = "gsj_order_id_handoff";

function readSnapshotOrders() {
    var rawText = null;
    try { rawText = localStorage.getItem(SNAPSHOT_KEY); } catch (ignoreError) { return null; }
    if (rawText === null) { return null; }
    try { return JSON.parse(rawText); } catch (parseError) { return null; }
}

function saveSnapshot() {
    var snapshotData = [];
    var snapshotNode = ordersList.head;
    while (snapshotNode !== null) {
        snapshotData[snapshotData.length] = snapshotNode.value;   // no push(): index assignment only
        snapshotNode = snapshotNode.next;
    }
    try { localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(snapshotData)); } catch (ignoreError) {}
}

function publishLatestOrderId() {
    var orderExists = ordersList.head !== null;
    var orderIdNumber = orderExists
        ? ordersList.head.value.orderId
        : nextOrderId;

    var handoff = {
        orderId: orderIdNumber,
        orderNumber: formatOrderId(orderIdNumber),
        orderExists: orderExists,
        sentAt: shopNowIso(),
        messageId: Date.now()
    };

    try {
        localStorage.setItem(ORDER_ID_HANDOFF_KEY, JSON.stringify(handoff));
    } catch (ignoreError) {}

    // Notify File Handling immediately if it is listening in this tab.
    window.dispatchEvent(new CustomEvent("gsj:order-id", {
        detail: handoff
    }));
}

function commitChanges() {
    checkUnclaimedOrders();
    renderAll();
    saveSnapshot();
    publishLatestOrderId();
}

function getSnapshotFileSummary(orderIdNumber) {
    var snapshotOrders = readSnapshotOrders();
    if (snapshotOrders === null) { return null; }
    var index;
    for (index = 0; index < snapshotOrders.length; index++) {
        if (snapshotOrders[index].orderId === orderIdNumber &&
            snapshotOrders[index].fileName !== null && snapshotOrders[index].fileName !== undefined) {
            return {
                fileName: snapshotOrders[index].fileName,
                fileCount: snapshotOrders[index].fileCount,
                fileDisposed: snapshotOrders[index].fileDisposed
            };
        }
    }
    return null;
}

function applySnapshotFileFields() {
    var snapshotOrders = readSnapshotOrders();
    if (snapshotOrders === null) { return; }
    var index;
    for (index = 0; index < snapshotOrders.length; index++) {
        var snapshotOrder = snapshotOrders[index];
        if (snapshotOrder.fileName === null || snapshotOrder.fileName === undefined) { continue; }
        var liveOrder = linkedListFindOrder(ordersList, snapshotOrder.orderId);
        if (liveOrder === null) { continue; }
        liveOrder.fileName = snapshotOrder.fileName;
        liveOrder.fileCount = snapshotOrder.fileCount;
        liveOrder.fileChannel = snapshotOrder.fileChannel;
        liveOrder.fileDisposed = snapshotOrder.fileDisposed;
        liveOrder.dateDisposed = snapshotOrder.dateDisposed;
    }
}

window.addEventListener("storage", function (storageEvent) {
    if (storageEvent.key === SNAPSHOT_KEY) {
        applySnapshotFileFields();
        renderAll();
    }
});

/* --------------------------------------------------------------------------
   13. START
   -------------------------------------------------------------------------- */

populateSelect(serviceTypeInput, SERVICE_TYPES);
populateSelect(colorTierInput, COLOR_TIERS);
populateSelect(fileChannelInput, ORDER_CHANNELS);

commitChanges();
    </script>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>File Handling &amp; Disposal</title>
<link rel="stylesheet" href="anika.css">
      
    <base target="_blank">



<style>/* ==========================================================================
   anika.css — shared stylesheet for Module 1/2/3 (Login&Signup, Account
   Management, Activity Log)
   Palette derived from the Grea San Jave logo: violet monogram, green/gray/
   red ring text, black outline, white ground.
   ========================================================================== */

:root {
  --primary-color: #6C4EE3;       /* violet monogram */
  --primary-color-dark: #5638C4;
  --primary-color-light: #EFEAFB;
  --secondary-color: #1E9E5A;     /* "Grea" green */
  --accent-color: #E23B3B;        /* "Jave" red */
  --dark-color: #2E2E33;          /* "San" charcoal */
  --background-color: #FAF9FC;
  --surface-color: #FFFFFF;
  --border-color: #E3DFF3;
  --text-color: #262530;
  --text-muted: #6B6876;
  --success-color: #1E9E5A;
  --success-bg: #E7F7EE;
  --error-color: #E23B3B;
  --error-bg: #FDECEC;
  --radius: 10px;
  --shadow: 0 2px 10px rgba(46, 46, 51, 0.08);
  --font-heading: Georgia, "Times New Roman", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--background-color);
  color: var(--text-color);
  line-height: 1.5;
}

a {
  color: var(--primary-color);
}

/* ---------- Layout shell ---------- */

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.75rem 1.5rem;
  background: var(--surface-color);
  border-bottom: 1px solid var(--border-color);
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 10;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.brand img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
}

.brand-text {
  font-family: var(--font-heading);
  font-weight: bold;
  font-size: 1.1rem;
  color: var(--dark-color);
}

.brand-text .accent {
  color: var(--accent-color);
}

.brand-text .secondary {
  color: var(--secondary-color);
}

.app-nav {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.app-nav a {
  padding: 0.45rem 0.9rem;
  border-radius: var(--radius);
  text-decoration: none;
  color: var(--text-color);
  font-size: 0.92rem;
  font-weight: 600;
}

.app-nav a.active,
.app-nav a:hover {
  background: var(--primary-color-light);
  color: var(--primary-color-dark);
}

.session-info {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 0.9rem;
  color: var(--text-muted);
}

main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.5rem;
}

.page-title {
  font-family: var(--font-heading);
  color: var(--dark-color);
  margin-bottom: 0.25rem;
}

.page-subtitle {
  color: var(--text-muted);
  margin-top: 0;
  margin-bottom: 1.5rem;
}

/* ---------- Cards / panels ---------- */

.card {
  background: var(--surface-color);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}

.card-title {
  margin-top: 0;
  font-size: 1.05rem;
  color: var(--dark-color);
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 0.6rem;
  margin-bottom: 1rem;
}

/* ---------- Auth screen (login/signup) ---------- */

.auth-shell {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  background: linear-gradient(160deg, var(--primary-color-light) 0%, var(--background-color) 55%);
}

.auth-card {
  width: 100%;
  max-width: 420px;
  background: var(--surface-color);
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(46, 46, 51, 0.12);
  padding: 2rem;
}

.auth-logo {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-bottom: 1.25rem;
}

.auth-logo img {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  margin-bottom: 0.6rem;
}

.auth-logo h1 {
  font-family: var(--font-heading);
  font-size: 1.25rem;
  margin: 0;
  color: var(--dark-color);
}

.auth-tabs {
  display: flex;
  border-radius: var(--radius);
  background: var(--primary-color-light);
  padding: 4px;
  margin-bottom: 1.5rem;
}

.auth-tabs button {
  flex: 1;
  border: none;
  background: transparent;
  padding: 0.55rem 0;
  border-radius: 8px;
  font-weight: 600;
  color: var(--primary-color-dark);
  cursor: pointer;
}

.auth-tabs button.active {
  background: var(--primary-color);
  color: white;
}

.auth-panel {
  display: none;
}

.auth-panel.active {
  display: block;
}

/* ---------- Forms ---------- */

.form-group {
  margin-bottom: 1rem;
}

label {
  display: block;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-color);
  margin-bottom: 0.3rem;
}

input[type="text"],
input:not([type]),
input[type="email"],
input[type="password"],
input[type="tel"],
input[type="search"],
select,
textarea {
  width: 100%;
  padding: 0.6rem 0.75rem;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  font-size: 0.95rem;
  font-family: inherit;
  background: var(--surface-color);
  color: var(--text-color);
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px var(--primary-color-light);
}

input.input-invalid {
  border-color: var(--error-color);
}

.field-error {
  color: var(--error-color);
  font-size: 0.8rem;
  margin-top: 0.25rem;
  min-height: 1em;
}

.field-hint {
  color: var(--text-muted);
  font-size: 0.78rem;
  margin-top: 0.25rem;
}

.form-row {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
}

.form-row .form-group {
  flex: 1;
  min-width: 180px;
}

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  padding: 0.6rem 1.1rem;
  border-radius: 8px;
  border: none;
  font-weight: 600;
  font-size: 0.92rem;
  cursor: pointer;
  text-decoration: none;
}

.btn-primary {
  background: var(--primary-color);
  color: white;
}

.btn-primary:hover {
  background: var(--primary-color-dark);
}

.btn-secondary {
  background: var(--primary-color-light);
  color: var(--primary-color-dark);
}

.btn-secondary:hover {
  background: #e2daf9;
}

.btn-danger {
  background: var(--error-bg);
  color: var(--error-color);
}

.btn-danger:hover {
  background: #fbd8d8;
}

.btn-success {
  background: var(--success-bg);
  color: var(--success-color);
}

.btn-success:hover {
  background: #d3f0e0;
}

.btn-block {
  width: 100%;
}

.btn-small {
  padding: 0.35rem 0.7rem;
  font-size: 0.8rem;
}

.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

/* ---------- Tables ---------- */

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
}

thead th {
  text-align: left;
  padding: 0.6rem 0.7rem;
  background: var(--primary-color-light);
  color: var(--primary-color-dark);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}

thead th .sort-arrow {
  font-size: 0.75rem;
  margin-left: 0.25rem;
  color: var(--text-muted);
}

tbody td {
  padding: 0.6rem 0.7rem;
  border-bottom: 1px solid var(--border-color);
  vertical-align: middle;
}

tbody tr:hover {
  background: var(--primary-color-light);
}

.empty-row td {
  text-align: center;
  color: var(--text-muted);
  padding: 2rem 0;
}

/* ---------- Badges ---------- */

.badge {
  display: inline-block;
  padding: 0.15rem 0.55rem;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 700;
}

.badge-active {
  background: var(--success-bg);
  color: var(--success-color);
}

.badge-inactive {
  background: var(--error-bg);
  color: var(--error-color);
}

.badge-role {
  background: var(--primary-color-light);
  color: var(--primary-color-dark);
}

.badge-customer {
  background: #FDEBE0;
  color: #B15A16;
}

.badge-staff {
  background: var(--primary-color-light);
  color: var(--primary-color-dark);
}

/* ---------- Toolbar (search/sort/filter controls) ---------- */

.toolbar {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  align-items: flex-end;
  margin-bottom: 1rem;
}

.toolbar .form-group {
  margin-bottom: 0;
  min-width: 170px;
}

/* ---------- Toasts ---------- */

#toastContainer {
  position: fixed;
  top: 1rem;
  right: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  z-index: 999;
}

.toast {
  padding: 0.7rem 1rem;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 600;
  box-shadow: var(--shadow);
  animation: toast-in 0.15s ease-out;
  max-width: 320px;
}

.toast-success {
  background: var(--success-bg);
  color: var(--success-color);
  border: 1px solid var(--success-color);
}

.toast-error {
  background: var(--error-bg);
  color: var(--error-color);
  border: 1px solid var(--error-color);
}

@keyframes toast-in {
  from { transform: translateY(-8px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* ---------- Dev-only verification panel ---------- */

.dev-note {
  background: #FFF8E1;
  border: 1px dashed #C79A1E;
  color: #7A5C10;
  border-radius: 8px;
  padding: 0.75rem 1rem;
  font-size: 0.85rem;
  margin-bottom: 1rem;
}

/* ---------- Modal ---------- */

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(46, 46, 51, 0.45);
  align-items: center;
  justify-content: center;
  padding: 1rem;
  z-index: 100;
}

.modal-overlay.open {
  display: flex;
}

.modal-box {
  background: var(--surface-color);
  border-radius: var(--radius);
  max-width: 480px;
  width: 100%;
  padding: 1.5rem;
  box-shadow: 0 10px 30px rgba(46, 46, 51, 0.2);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 0.6rem;
  margin-top: 1.25rem;
}

.suspicious-card {
  border-color: var(--error-color);
}

.suspicious-title {
  color: var(--error-color);
}

.suspicious-row td {
  color: var(--error-color);
  background: var(--error-bg);
}

/* ---------- Responsive ---------- */

@media (max-width: 720px) {
  .app-header {
    flex-direction: column;
    align-items: flex-start;
  }
  .session-info {
    order: 3;
  }
  main {
    padding: 1rem;
  }
  .auth-card {
    padding: 1.5rem;
  }
}

@media (max-width: 480px) {
  thead {
    display: none;
  }
  table, tbody, tr, td {
    display: block;
    width: 100%;
  }
  tbody tr {
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    margin-bottom: 0.75rem;
    padding: 0.5rem 0.75rem;
  }
  tbody td {
    border-bottom: none;
    padding: 0.35rem 0;
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
  }
  tbody td::before {
    content: attr(data-label);
    font-weight: 700;
    color: var(--text-muted);
    margin-right: 0.5rem;
  }
}

/* ==========================================================================
   Dashboards (Owner / Staff / Customer landing pages)
   Reuses --primary/--secondary/--accent/--dark/--surface/--border tokens and
   the existing .card/.btn/.badge system above — no new palette introduced.
   ========================================================================== */

.dashboard-welcome {
  font-family: var(--font-heading);
  color: var(--dark-color);
  margin: 0 0 0.25rem;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.stat-card {
  background: var(--surface-color);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 1.1rem 1.25rem;
}

.stat-value {
  font-family: var(--font-heading);
  font-size: 1.8rem;
  font-weight: bold;
  color: var(--primary-color-dark);
  line-height: 1.1;
}

.stat-label {
  font-size: 0.82rem;
  color: var(--text-muted);
  margin-top: 0.3rem;
}

.dashboard-columns {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 1.5rem;
  align-items: start;
}

@media (max-width: 860px) {
  .dashboard-columns {
    grid-template-columns: 1fr;
  }
}

.activity-feed {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  max-height: 420px;
  overflow-y: auto;
}

.activity-item {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 0.5rem;
  padding: 0.6rem 0.7rem;
  border: 1px solid var(--border-color);
  border-radius: 8px;
}

.activity-text {
  flex: 1;
  min-width: 160px;
  font-size: 0.88rem;
  color: var(--text-color);
}

.activity-time {
  font-size: 0.78rem;
  color: var(--text-muted);
  white-space: nowrap;
}

.quick-actions-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 0.75rem;
}

.profile-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.profile-list li {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border-color);
  font-size: 0.92rem;
}

.profile-list li:last-child {
  border-bottom: none;
}

.profile-list .profile-label {
  color: var(--text-muted);
}

.profile-list .profile-value {
  font-weight: 600;
  color: var(--text-color);
  text-align: right;
}

.status-track {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin: 0;
}

.status-track li {
  list-style: none;
  padding: 0.45rem 0.85rem;
  border-radius: 999px;
  background: var(--primary-color-light);
  color: var(--primary-color-dark);
  font-size: 0.82rem;
  font-weight: 700;
}

.coming-soon-card {
  background: var(--primary-color-light);
  border: 1px dashed var(--primary-color);
  border-radius: var(--radius);
  padding: 1.1rem 1.25rem;
  color: var(--primary-color-dark);
  font-size: 0.88rem;
}

.coming-soon-card strong {
  display: block;
  margin-bottom: 0.3rem;
  color: var(--dark-color);
}

    </style>
</head>

<body>

    <main>

        <h1 class="page-title">File Handling &amp; Disposal</h1>
        <p class="page-subtitle"></p>

        <!-- SUMMARY CARDS -->
        <section class="stat-grid" aria-label="File summary">

            <div class="stat-card">
                <p class="stat-label">Total files</p>
                <p class="stat-value" id="stat-total">0</p>
            </div>

            <div class="stat-card">
                <p class="stat-label">Valid</p>
                <p class="stat-value" id="stat-valid">0</p>
            </div>

            <div class="stat-card">
                <p class="stat-label">Flagged</p>
                <p class="stat-value" id="stat-flagged">0</p>
            </div>

            <div class="stat-card">
                <p class="stat-label">Disposed</p>
                <p class="stat-value" id="stat-disposed">0</p>
            </div>

        </section>

        <section class="card">

            <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">

                <h3  style="margin:0;">Print Files</h3>

                <div style="display:flex; align-items:center; gap:10px;">

                    <input
                        type="search"
                        id="search-input"
                        class="input search-input"
                        placeholder="Search files or orders..."
                        autocomplete="off"
                        style="padding:6px 10px; flex-grow:1;">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="export-btn"
                        style="white-space:nowrap; flex-grow:1;">
                        Export log
                    </button>


                </div>

            </div>

            <hr style="width:100%; margin:12px 0; border:none; border-top:1px solid #e5e5e5;">

            <div class="table-wrap">

                <table class="data-table">

                    <thead>
                        <tr>
                            <th scope="col">File ID</th>
                            <th scope="col">Linked order</th>
                            <th scope="col">File name</th>
                            <th scope="col">Channel</th>
                            <th scope="col">Size</th>
                            <th scope="col">Validation</th>
                            <th scope="col">Order status</th>
                            <th scope="col">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="file-table-body">
                        <!-- built via script -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- ADD FILE DIALOG -->
    <div
        class="modal-overlay"
        id="file-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
        hidden>

        <div class="modal-box">

            <div class="modal-head">

                <button
                    type="button"
                    class="icon-btn"
                    id="modal-close"
                    aria-label="Close">
                    &#215;
                </button>

                <h3 id="modal-title">New print file</h3>

            </div>

            <div class="modal-body">

                <div class="form-row">

                    <div class="form-group" id="field-orderId">

                        <label  for="orderId">Order ID</label>

                  <select id="orderId" class="input">
    <option value="">No orders available</option>
</select>

                        <p class="field-error" id="orderId-error"></p>

                    </div>

                    <div class="form-group" id="field-fileChannel">

                        <label  for="fileChannel">Received via</label>

 <select id="fileChannel" class="input" aria-describedby="fileChannel-error">
     <option value="">Select an order first</option>
 </select>

                        <p class="field-error" id="fileChannel-error"></p>

                    </div>

                    <div class="form-group" id="field-filePicker">

                        <label  for="filePicker">Print file</label>

                        <input
                            type="file"
                            id="filePicker"
                            accept=".pdf,.jpg,.jpeg,.png,.tiff,.tif,.docx,.doc,.ai,.psd"
                            style="display: none;">

                        <label
                            class="btn btn-secondary btn-block"
                            id="file-drop"
                            for="filePicker">
                            Choose print file
                        </label>

                        <p class="field-hint" id="file-status" aria-live="polite">No file selected.</p>

                        <p class="field-error" id="filePicker-error"></p>

                    </div>

                </div>

                <div class="modal-actions">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="cancel-btn">
                        Cancel
                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        id="save-btn">
                        Add
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- VIEW FILE DIALOG -->
    <div
        class="modal-overlay"
        id="view-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="view-modal-title"
        hidden>

        <div class="modal-box">

            <div class="modal-head">

                <h3 id="view-modal-title">File details</h3>

                <button
                    type="button"
                    class="icon-btn"
                    id="view-modal-close"
                    aria-label="Close">
                    &#215;
                </button>

            </div>

            <div class="modal-body" id="view-modal-body">
                <!-- details via script -->
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-primary" id="view-modal-done">Done</button>
            </div>

        </div>

    </div>


    <div id="toastContainer" aria-live="polite"></div>

    <script>
        
/* ==========================================================================
   HAND-CODED HELPERS - plain loops and index assignment only.
   No array methods, no string-method shortcuts, no Math, no JSON, no Number.is*.
   ========================================================================== */
//  The value for 'not a number' (0 divided by 0 gives NaN)
var NOT_A_NUMBER = 0 / 0;
//  All capital letters, used to change letter case
var UPPERCASE_LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
//  All small letters, used to change letter case
var LOWERCASE_LETTERS = "abcdefghijklmnopqrstuvwxyz";
//  Short month names, used when showing dates
var MONTH_ABBREVIATIONS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
 
//  Checks if one character is a space, tab, or new line
function isSpaceCharacter(characterText) {
    return characterText === " " || characterText === "\t" || characterText === "\n" ||
        characterText === "\r" || characterText === "\f" || characterText === "\v";
}
 
//  Copies the letters from the start position up to (not including) the end position
function copySubstring(sourceText, startIndex, endIndex) {
    var resultText = "";
    var charIndex;
    for (charIndex = startIndex; charIndex < endIndex && charIndex < sourceText.length; charIndex = charIndex + 1) {
        resultText = resultText + sourceText[charIndex];
    }
    return resultText;

    for (index = 0; index < totalCount; index++) {

        resultText = resultText + ListGet(listRef, index);

        if (index < totalCount - 1) {
            resultText = resultText + separatorText;
        }

    }

    return resultText;

}

// builds an empty  stack
function createStack() {
    return { stackData: [], stackCount: 0 };
}

// pushes value onto the top
function StackPush(stackRef, itemValue) {
    stackRef.stackData[stackRef.stackCount] = itemValue;
    stackRef.stackCount = stackRef.stackCount + 1;
}

// current stack size
function StackSize(stackRef) {
    return stackRef.stackCount;
}

// reads an item counting down from top
function StackGetFromTop(stackRef, offsetFromTop) {
    var actualPosition = stackRef.stackCount - 1 - offsetFromTop;
    return stackRef.stackData[actualPosition];
}

//  text search without String.indexOf
function TextContains(sourceText, targetText) {

    if (targetText === "") {
        return true;
    }

    if (targetText.length > sourceText.length) {
        return false;
    }

    var startIndex;
    var offsetIndex;
    var matches;

    for (startIndex = 0; startIndex <= sourceText.length - targetText.length; startIndex++) {

        matches = true;

        for (offsetIndex = 0; offsetIndex < targetText.length; offsetIndex++) {
            if (sourceText[startIndex + offsetIndex] !== targetText[offsetIndex]) {
                matches = false;
                break;
            }
        }

        if (matches) {
            return true;
        }

    }

    return false;

}

//  linear search on a plain array
function arrayContainsValue(sourceArray, targetValue) {

    var index;

    for (index = 0; index < sourceArray.length; index++) {

        if (sourceArray[index] === targetValue) {
            return true;
        }

    }

    return false;

}

   5. TEXT & NUMBER HELPERS

// pads a number with zeros
function padLeft(rawValue, targetWidth) {

    var textValue = String(rawValue);

    while (textValue.length < targetWidth) {
        textValue = "0" + textValue;
    }

    return textValue;

}

// current time as HH:MM:SS
function nowStamp() {

    var currentDate = new Date();

    return padLeft(currentDate.getHours(), 2) + ":" +
           padLeft(currentDate.getMinutes(), 2) + ":" +
           padLeft(currentDate.getSeconds(), 2);

}

// today as YYYY-MM-DD
function todayAsInputValue() {

    var currentDate = new Date();
    var yearNumber  = currentDate.getFullYear();
    var monthNumber = currentDate.getMonth() + 1;
    var dayNumber   = currentDate.getDate();

    return yearNumber + "-" + padLeft(monthNumber, 2) + "-" + padLeft(dayNumber, 2);

}

// builds FILE-00N display id
function formatFileId(fileIdNumber) {
    return "FILE-" + padLeft(fileIdNumber, 3);
}

//  date parse, no split()
function formatDateForDisplay(dateValueText) {

    if (!dateValueText) {
        return "—";
    }

    var yearText  = "";
    var monthText = "";
    var dayText   = "";
    var partNumber = 1;
    var charIndex;
    var currentChar;

    for (charIndex = 0; charIndex < dateValueText.length; charIndex++) {

        currentChar = dateValueText[charIndex];

        if (currentChar === "-") {
            partNumber = partNumber + 1;
        } else if (partNumber === 1) {
            yearText = yearText + currentChar;
        } else if (partNumber === 2) {
            monthText = monthText + currentChar;
        } else if (partNumber === 3) {
            dayText = dayText + currentChar;
        }

    }

    if (partNumber !== 3) {
        return dateValueText;
    }

    var monthNames = [
        "Jan", "Feb", "Mar", "Apr", "May", "Jun",
        "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
    ];

    var monthIndex = Number(monthText) - 1;

    if (monthIndex < 0 || monthIndex > 11) {
        return dateValueText;
    }

    return Number(dayText) + " " + monthNames[monthIndex] + " " + yearText;

}

// human-readable byte size
function formatBytes(byteCount) {
    var units = ["B", "KB", "MB", "GB"];
    var unit = 0;
    var value = byteCount;
    var tenths;
    while (value >= 1024 && unit < 3) { value = value / 1024; unit = unit + 1; }
    if (unit === 0) { return String(value) + " B"; }
    if (value >= 10) { return String(roundNumber(value)) + " " + units[unit]; }
    tenths = roundNumber(value * 10);
    return String(floorNumber(tenths / 10)) + "." + String(tenths - floorNumber(tenths / 10) * 10) + " " + units[unit];
}

// derives the drop-zone label from ALLOWED_EXTENSIONS + MAX_FILE_BYTES
// so the UI text is never retyped (and can never disagree with the limits)
function buildDropZoneLabel() {

    var extensionList = createList();
    var index;

    for (index = 0; index < ALLOWED_EXTENSIONS.length; index++) {
        ListAppend(extensionList, UpperText(ALLOWED_EXTENSIONS[index]));
    }

    var sizeLimitMb = MAX_FILE_BYTES / (1024 * 1024);

    return "Choose print file (" + JoinList(extensionList, ", ") +
           " — max " + sizeLimitMb + " MB)";

}


/* --------------------------------------------------------------------------
   6. FILE EXTENSION & SIGNATURE SCAN
   -------------------------------------------------------------------------- */

//  extension extract, no lastIndexOf/slice
function getExtension(fileNameText) {

    var lastDotPosition = -1;
    var charIndex;

    for (charIndex = 0; charIndex < fileNameText.length; charIndex++) {

        if (fileNameText[charIndex] === ".") {
            lastDotPosition = charIndex;
        }

    }

    if (lastDotPosition === -1 || lastDotPosition === fileNameText.length - 1) {
        return "";
    }

    var extensionText = "";

    for (charIndex = lastDotPosition + 1; charIndex < fileNameText.length; charIndex++) {
        extensionText = extensionText + fileNameText[charIndex];
    }

    return LowerText(extensionText);

}

// compares bytes against a signature
function bytesMatchSignature(byteValues, signaturePattern) {

    var index;

    if (byteValues.length < signaturePattern.length) {
        return false;
    }

    for (index = 0; index < signaturePattern.length; index++) {

        if (byteValues[index] !== signaturePattern[index]) {
            return false;
        }

    }

    return true;

}

// reads first 16 bytes, callback style
function readFileHeaderBytes(fileToRead, onDoneCallback) {

    var fileReader = new FileReader();

    fileReader.onload = function (loadEvent) {
        onDoneCallback(new Uint8Array(loadEvent.target.result));
    };

    fileReader.onerror = function () {
        onDoneCallback(null);
    };

    fileReader.readAsArrayBuffer(fileToRead.slice(0, 16));

}

// automatic corruption scan by real bytes
function checkFileHeader(fileToCheck, onDoneCallback) {

    var fileExtensionText = getExtension(fileToCheck.name);
    var knownSignatures    = FILE_SIGNATURES[fileExtensionText];

    if (!knownSignatures) {
        onDoneCallback({ headerIsValid: true, headerReasonText: "" });
        return;
    }

    readFileHeaderBytes(fileToCheck, function (headerBytes) {

        var matchFound = false;
        var signatureIndex;

        if (!headerBytes) {
            onDoneCallback({ headerIsValid: false, headerReasonText: "Could not read file" });
            return;
        }

        for (signatureIndex = 0; signatureIndex < knownSignatures.length; signatureIndex++) {

            if (bytesMatchSignature(headerBytes, knownSignatures[signatureIndex])) {
                matchFound = true;
            }

        }

        if (!matchFound) {
            onDoneCallback({ headerIsValid: false, headerReasonText: "Header mismatch for ." + fileExtensionText });
            return;
        }

        onDoneCallback({ headerIsValid: true, headerReasonText: "" });

    });

}


/* --------------------------------------------------------------------------
   7. VALIDATION — flags missing, oversized, or corrupted files
   -------------------------------------------------------------------------- */

// returns validationResult + flagReasonText
function validateFile(fileNameText, fileSizeBytes, headerCheckResult) {

    if (!fileNameText) {
        return { validationResult: VALIDATION_RESULTS.MISSING, flagReasonText: "No file attached" };
    }

    var fileExtensionText = getExtension(fileNameText);

    if (!arrayContainsValue(ALLOWED_EXTENSIONS, fileExtensionText)) {
        return { validationResult: VALIDATION_RESULTS.CORRUPTED, flagReasonText: "Unsupported file type (." + fileExtensionText + ")" };
    }

    if (fileSizeBytes === 0) {
        return { validationResult: VALIDATION_RESULTS.CORRUPTED, flagReasonText: "File is empty" };
    }

    if (fileSizeBytes > MAX_FILE_BYTES) {
        return { validationResult: VALIDATION_RESULTS.CORRUPTED, flagReasonText: "Exceeds " + (MAX_FILE_BYTES / (1024 * 1024)) + " MB limit" };
    }

    if (headerCheckResult && !headerCheckResult.headerIsValid) {
        return { validationResult: VALIDATION_RESULTS.CORRUPTED, flagReasonText: headerCheckResult.headerReasonText };
    }

    return { validationResult: VALIDATION_RESULTS.VALID };

}

function markFieldInvalid(fieldElementId) {

// records one audit stack entry
function addAuditEntry(actionTypeText, detailText) {

    var entryRecord = {
        entryTime: todayAsInputValue() + " " + nowStamp(),
        actionType: actionTypeText,
        detailText: detailText
    };

    StackPush(auditStack, entryRecord);

    renderAuditLog();

}

// draws the audit log, newest first
function renderAuditLog() {

    if (!auditList) { return; }

    auditList.textContent = "";

    var totalCount = StackSize(auditStack);

    if (totalCount === 0) {
        var emptyItem = document.createElement("li");
        emptyItem.className = "activity-item";
        emptyItem.textContent = "No actions recorded yet.";
        auditList.appendChild(emptyItem);
        return;
    }

    var offsetIndex;

    for (offsetIndex = 0; offsetIndex < totalCount; offsetIndex++) {
        auditList.appendChild(buildAuditItem(StackGetFromTop(auditStack, offsetIndex)));
    }

}

// builds one audit list row
function buildAuditItem(entryRecord) {

    var itemElement = document.createElement("li");
    itemElement.className = "activity-item";

    var actionSpan = document.createElement("span");
    actionSpan.className = "badge badge-role";

    timeSpan.textContent = entryRecord.entryTime;

    itemElement.appendChild(actionSpan);
    itemElement.appendChild(detailSpan);
    itemElement.appendChild(timeSpan);

    return itemElement;

}

// populates the channel dropdown from ORDER_CHANNELS (no hardcoded options)
function getOrderSnapshot() {
    try {
        var orders = parseJson(localStorage.getItem("gsj_orders_snapshot") || "[]");
        return isArray(orders) ? orders : [];
    } catch (error) {
        return [];
    }
}

// Show files submitted by Order Maker from the shared order snapshot.
function syncFilesFromOrders() {
    var orders = getOrderSnapshot();
    var orderIndex;
    for (orderIndex = 0; orderIndex < orders.length; orderIndex++) {
        var order = orders[orderIndex];
        var orderFiles = order.files || order.fileNames;
        if (typeof orderFiles === "string") {
            orderFiles = [orderFiles];
        } else if (!isArray(orderFiles)) {
            orderFiles = order.fileName ? [order.fileName] : [];
        }
        var expectedFileCount = isWholeNumber(order.fileCount) && order.fileCount > 0 ? order.fileCount : 0;
        var importedFileCount = maxNumber(orderFiles.length, expectedFileCount);
        for (var fileIndex = 0; fileIndex < importedFileCount; fileIndex++) {
            var source = orderFiles[fileIndex];
            var fileName = typeof source === "string" ? source : source && (source.name || source.fileName);
            var isNamedFile = !!fileName;
            if (!isNamedFile) {
                fileName = "Unnamed file " + (fileIndex + 1) + " (Order " + order.orderId + ")";
            }
            var found = false;
            for (var currentIndex = 0; currentIndex < ListSize(filesList); currentIndex++) {
                var current = ListGet(filesList, currentIndex);
                if (Number(current.orderId) === Number(order.orderId) &&
                    (current.sourceFileIndex === fileIndex ||
                     (current.sourceFileIndex === undefined && current.fileName === fileName))) {
                    found = true;
                    break;
                }
            }
            if (found) {
                var existingFile = ListGet(filesList, currentIndex);
                existingFile.fileName = fileName;
                existingFile.status = order.status || existingFile.status;
                existingFile.fileChannel = (source && source.fileChannel) || order.fileChannel || existingFile.fileChannel;
                existingFile.fileSize = (source && (source.size || source.fileSize)) || existingFile.fileSize;
                existingFile.validationResult = isNamedFile
                    ? ((source && source.validationResult) || order.fileValidationResult || existingFile.validationResult)
                    : VALIDATION_RESULTS.MISSING;
                existingFile.flagReasonText = isNamedFile
                    ? ((source && source.flagReasonText) || order.fileFlagReasonText || existingFile.flagReasonText)
                    : "Filename is not available in Order Management.";
                existingFile.sourceFileIndex = fileIndex;
                if ((source && source.fileDisposed) || order.fileDisposed) {
                    existingFile.fileDisposed = true;
                    existingFile.dateDisposed = (source && source.dateDisposed) || order.dateDisposed || existingFile.dateDisposed;
                    existingFile.disposedBy = (source && source.disposedBy) || existingFile.disposedBy;
                    existingFile.sourceFile = null;
                }
                continue;
            }
            ListAppend(filesList, {
                fileId: nextFileId++, orderId: Number(order.orderId), fileName: fileName,
                sourceFileIndex: fileIndex,
                fileChannel: (source && source.fileChannel) || order.fileChannel || ORDER_CHANNELS.CUSTOMER_PORTAL,
                fileSize: source && source.size ? source.size : (source && source.fileSize ? source.fileSize : (order.fileSize || 0)),
                dateAdded: (source && source.dateAdded) || order.dateAdded || order.createdAt || todayAsInputValue(),
                validationResult: !isNamedFile ? VALIDATION_RESULTS.MISSING :
                    ((source && source.validationResult) || order.fileValidationResult || VALIDATION_RESULTS.VALID),
                flagReasonText: !isNamedFile ? "Filename is not available in Order Management." :
                    ((source && source.flagReasonText) || order.fileFlagReasonText || ""),
                status: order.status || ORDER_STATUS.QUEUED,
                fileDisposed: !!((source && source.fileDisposed) || order.fileDisposed),
                dateDisposed: (source && source.dateDisposed) || order.dateDisposed || "",
                disposedBy: (source && source.disposedBy) || "", sourceFile: null
            });
        }
    }
}

function syncOrderFileFields(orderId) {
    var orders = getOrderSnapshot();
    var linkedOrder = null;
    var latestFile = null;
    var fileCount = 0;
    var activeFileCount = 0;
    var latestDisposedDate = "";
    var linkedFiles = [];
    var orderIndex;
    var fileIndex;

    for (orderIndex = 0; orderIndex < orders.length; orderIndex++) {
        if (Number(orders[orderIndex].orderId) === Number(orderId)) {
            linkedOrder = orders[orderIndex];
            break;
        }
    }

    if (!linkedOrder) return;

    for (fileIndex = 0; fileIndex < ListSize(filesList); fileIndex++) {
        var fileRecord = ListGet(filesList, fileIndex);

        if (Number(fileRecord.orderId) !== Number(orderId)) continue;

        fileCount++;
        latestFile = fileRecord;
        if (fileRecord.sourceFileIndex === undefined) {
            fileRecord.sourceFileIndex = fileCount - 1;
        }
        linkedFiles[linkedFiles.length] = {
            name: fileRecord.fileName,
            fileName: fileRecord.fileName,
            size: fileRecord.fileSize,
            fileSize: fileRecord.fileSize,
            fileChannel: fileRecord.fileChannel,
            dateAdded: fileRecord.dateAdded,
            validationResult: fileRecord.validationResult,
            flagReasonText: fileRecord.flagReasonText,
            fileDisposed: fileRecord.fileDisposed,
            dateDisposed: fileRecord.dateDisposed,
            disposedBy: fileRecord.disposedBy
        };

        if (fileRecord.fileDisposed) {
            latestDisposedDate = fileRecord.dateDisposed;
        } else {
            activeFileCount++;
        }
    }

    linkedOrder.fileName = latestFile ? latestFile.fileName : null;
    linkedOrder.fileCount = fileCount;
    linkedOrder.files = linkedFiles;
    linkedOrder.fileDisposed = fileCount > 0 && activeFileCount === 0;
    linkedOrder.dateDisposed = linkedOrder.fileDisposed ? latestDisposedDate : null;
    linkedOrder.fileValidationResult = latestFile ? latestFile.validationResult : null;
    linkedOrder.fileFlagReasonText = latestFile ? (latestFile.flagReasonText || "") : "";

    try {
        localStorage.setItem("gsj_orders_snapshot", stringifyJson(orders));
        window.dispatchEvent(new CustomEvent("gsj:file-updated", { detail: linkedOrder }));
    } catch (error) {
        showToast("Could not sync file details to Order Management.", TOAST_KINDS.ERROR);
    }
}

function getSelectedOrder() {
    var orders = getOrderSnapshot();
    var index;

    for (index = 0; index < orders.length; index++) {
        if (String(orders[index].orderId) === orderIdInput.value) {
            return orders[index];
        }
    }

    return null;
}

function updateSelectedOrderChannel() {
    var order = getSelectedOrder();
    fileChannelInput.value = order && order.fileChannel ? order.fileChannel : "";
}

// populates the channel dropdown from ORDER_CHANNELS
function populateChannelSelect() {

    fileChannelInput.textContent = "";

    var placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Select a channel...";
    fileChannelInput.appendChild(placeholder);

    var channelKey;

    for (channelKey in ORDER_CHANNELS) {
        if (true) {
            var option = document.createElement("option");
            option.value = ORDER_CHANNELS[channelKey];
            option.textContent = ORDER_CHANNELS[channelKey];
            fileChannelInput.appendChild(option);

function populateOrderSelect() {
    var previousValue = orderIdInput.value;
    var orders = getOrderSnapshot();
    var availableOrders = createList();
    var index;

    orderIdInput.textContent = "";

    for (index = 0; index < orders.length; index++) {
        var status = orders[index].status;

        if (
            status !== ORDER_STATUS.DONE &&
            status !== ORDER_STATUS.UNCLAIMED &&
            status !== ORDER_STATUS.CANCELLED
        ) {
            ListAppend(availableOrders, orders[index]);
        }
    }

    if (ListSize(availableOrders) === 0) {
        var emptyOption = document.createElement("option");
        emptyOption.value = "";
        emptyOption.textContent = "No orders available";
        orderIdInput.appendChild(emptyOption);
        fileChannelInput.value = "";
        return;
    }

    var placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Select an order...";
    orderIdInput.appendChild(placeholder);

    for (index = 0; index < ListSize(availableOrders); index++) {
        var order = ListGet(availableOrders, index);
        var option = document.createElement("option");
        option.value = String(order.orderId);
        option.textContent = "ORD-" + padLeft(order.orderId, 4) +
            (order.customerName ? " — " + order.customerName : "");
        orderIdInput.appendChild(option);
    }

    orderIdInput.value = previousValue;
    updateSelectedOrderChannel();
}

/* --------------------------------------------------------------------------
   10. SAVING — stores an automatically-validated file
   -------------------------------------------------------------------------- */

// validates inputs, appends new file record
function saveFile() {

    clearFieldErrors();

var orderIdText = orderIdInput.value;
var linkedOrder = getSelectedOrder();
var fileChannelText = fileChannelInput.value;

    var firstInvalidInput = null;

if (!linkedOrder || orderIdText === "") {
    markFieldInvalid("field-orderId");
    firstInvalidInput = firstInvalidInput || orderIdInput;
}

    if (fileChannelText === "") {
        markFieldInvalid("field-fileChannel");
        firstInvalidInput = firstInvalidInput || fileChannelInput;
    }

    if (!pickedFile) {
        markFieldInvalid("field-filePicker");
        firstInvalidInput = firstInvalidInput || fileDrop;
    }

    if (firstInvalidInput) {
        firstInvalidInput.focus();
        return;
    }

    if (isCheckingFile) {
        showToast("Still scanning file, wait please", TOAST_KINDS.WARNING);
        return;
    }

    var validationCheckResult = validateFile(pickedFile.name, pickedFile.size, pickedFileHeaderCheck);

    // field names mirror the Order schema's file-submission block:
    // orderId, fileName, fileChannel, fileDisposed, dateDisposed, dateAdded
    var newFileRecord = {
        fileId: nextFileId,
        orderId: Number(orderIdText),
        fileName: pickedFile.name,
        fileChannel: fileChannelText,
        fileSize: pickedFile.size,
        dateAdded: todayAsInputValue(),
        validationResult: validationCheckResult.validationResult,
        flagReasonText: validationCheckResult.flagReasonText,
        status: ORDER_STATUS.QUEUED,
        fileDisposed: false,
        dateDisposed: "",
        disposedBy: "",
        sourceFile: pickedFile
    };

    nextFileId = nextFileId + 1;

    ListAppend(filesList, newFileRecord);
    syncOrderFileFields(newFileRecord.orderId);

    addAuditEntry(AUDIT_ACTIONS.UPLOAD, formatFileId(newFileRecord.fileId) + " (" + pickedFile.name +
        ") received via " + fileChannelText + " for " + orderIdText);

    if (validationCheckResult.validationResult !== VALIDATION_RESULTS.VALID) {
        addAuditEntry(AUDIT_ACTIONS.FLAG, formatFileId(newFileRecord.fileId) + " flagged as " +
            validationCheckResult.validationResult + ": " + validationCheckResult.flagReasonText);
    }

    renderTable();
    renderStats();

    closeFileModal();

    if (validationCheckResult.validationResult === VALIDATION_RESULTS.VALID) {
        showToast(newFileRecord.fileName + " validated, ready to print", TOAST_KINDS.SUCCESS);
    } else {
        showToast("File flagged: " + validationCheckResult.flagReasonText, TOAST_KINDS.WARNING);
    }

}


/* --------------------------------------------------------------------------
   11. RE-VALIDATION & DISPOSAL
   -------------------------------------------------------------------------- */

// linear search by fileId
function findFile(targetFileId) {

    var totalCount = ListSize(filesList);
    var index;

    for (index = 0; index < totalCount; index++) {

        var currentFile = ListGet(filesList, index);

        if (currentFile.fileId === targetFileId) {
            return currentFile;
        }

    }

    return null;

}

// re-runs validation on demand
function revalidateFile(targetFileId) {

    var targetFile = findFile(targetFileId);

    if (!targetFile) {
        return;
    }

    if (targetFile.sourceFile && targetFile.sourceFile.name === targetFile.fileName) {

        checkFileHeader(targetFile.sourceFile, function (headerCheckResult) {

            var validationCheckResult = validateFile(
                targetFile.fileName,
                targetFile.fileSize,
                headerCheckResult
            );

            targetFile.validationResult = validationCheckResult.validationResult;
            targetFile.flagReasonText = validationCheckResult.flagReasonText;

            addAuditEntry(AUDIT_ACTIONS.VALIDATE, formatFileId(targetFile.fileId) + " re-validated: " +
                validationCheckResult.validationResult + " — " + validationCheckResult.flagReasonText);

            renderTable();
            renderStats();

            if (validationCheckResult.validationResult === VALIDATION_RESULTS.VALID) {
                showToast(targetFile.fileName + " passed re-check", TOAST_KINDS.SUCCESS);
            } else {
                showToast("Still flagged: " + validationCheckResult.flagReasonText, TOAST_KINDS.WARNING);
            }

        });

    } else {

        var metadataValidation = validateFile(targetFile.fileName, targetFile.fileSize, null);
        targetFile.validationResult = metadataValidation.validationResult;
        targetFile.flagReasonText = metadataValidation.flagReasonText + " (file bytes unavailable for this session)";

        addAuditEntry(AUDIT_ACTIONS.VALIDATE, formatFileId(targetFile.fileId) + " re-validated from metadata: " +
            metadataValidation.validationResult);

        renderTable();
        renderStats();
        showToast("Re-check used saved file metadata only", TOAST_KINDS.WARNING);

    }

}

// permanent disposal,  or auto
function disposeFile(targetFileId, triggeredByText) {

    var targetFile = findFile(targetFileId);

    if (!targetFile || targetFile.fileDisposed) {
        return;
    }

    targetFile.fileDisposed = true;
    targetFile.dateDisposed = todayAsInputValue() + " " + nowStamp();
    targetFile.disposedBy = triggeredByText;
    targetFile.sourceFile = null;
    syncOrderFileFields(targetFile.orderId);

    var auditActionType = triggeredByText === DISPOSAL_TRIGGERS.AUTO_ORDER_DONE ?
        AUDIT_ACTIONS.AUTO_DISPOSE : AUDIT_ACTIONS.DISPOSE;

    addAuditEntry(auditActionType, formatFileId(targetFile.fileId) + " (" + targetFile.fileName +
        ") disposed for " + targetFile.orderId + " — removed from storage. Trigger: " + triggeredByText);

    renderTable();
    renderStats();

    showToast("File disposed; in-memory file reference released", TOAST_KINDS.WARNING);

}


/* --------------------------------------------------------------------------
   12. ORDER STATUS — DONE triggers auto-disposal (schema: Module 4 spec)
   -------------------------------------------------------------------------- */

// updates linked order status
function setOrderStatus(targetFileId, newStatusText) {

    var targetFile = findFile(targetFileId);

    if (!targetFile || targetFile.fileDisposed) {
        return;
    }

    targetFile.status = newStatusText;

    addAuditEntry(AUDIT_ACTIONS.ORDER_DONE, targetFile.orderId + " moved to " + newStatusText +
        " (linked to " + formatFileId(targetFile.fileId) + ")");

    // auto-dispose stored files once Order.status === ORDER_STATUS.DONE
    if (newStatusText === ORDER_STATUS.DONE) {
        disposeFile(targetFileId, DISPOSAL_TRIGGERS.AUTO_ORDER_DONE);
        return;
    }

    renderTable();
    renderStats();

}


/* --------------------------------------------------------------------------
   13. TABLE RENDERING
   -------------------------------------------------------------------------- */

// redraws the whole file table
function renderTable() {

    fileTableBody.textContent = "";

    var visibleFilesList = filterFiles();
    var totalCount = ListSize(visibleFilesList);

    if (totalCount === 0) {
        fileTableBody.appendChild(buildEmptyRow());
        return;
    }

    var index;

    for (index = 0; index < totalCount; index++) {
        fileTableBody.appendChild(buildFileRow(ListGet(visibleFilesList, index)));
    }

}

//  search filter, returns a list
function filterFiles() {

    var queryText  = toLowerCaseText(trimWhitespace(searchInput.value));
    var resultList = createList();
    var totalCount = ListSize(filesList);
    var index;

    for (index = 0; index < totalCount; index++) {

        var currentFile = ListGet(filesList, index);

        if (queryText === "") {
            ListAppend(resultList, currentFile);
            continue;
        }

        var haystackText = toLowerCaseText((
            formatFileId(currentFile.fileId) + " " +
            currentFile.orderId + " " +
            currentFile.fileName + " " +
            currentFile.fileChannel + " " +
            currentFile.validationResult + " " +
            currentFile.status
        ));

        if (TextContains(haystackText, queryText)) {
            ListAppend(resultList, currentFile);
        }

    }

    return resultList;

}

// placeholder row for an empty table
function buildEmptyRow() {

    var emptyRow = document.createElement("tr");
    emptyRow.className = "empty-row";

    var emptyCell = document.createElement("td");
    emptyCell.colSpan = 8;
    emptyCell.textContent = "No print files yet. Add one to validate it for printing.";

    emptyRow.appendChild(emptyCell);

    return emptyRow;

}

// builds one file table row
function buildFileRow(fileRecord) {

    var fileRow = document.createElement("tr");

    if (fileRecord.fileDisposed) {
        fileRow.style.opacity = "0.5";
    }

    var fileIdCell = document.createElement("td");
    fileIdCell.className = "id-cell";
    fileIdCell.setAttribute("data-label", "File ID");
    fileIdCell.textContent = formatFileId(fileRecord.fileId);
    fileRow.appendChild(fileIdCell);

    fileRow.appendChild(buildTextCell(fileRecord.orderId, "Linked order"));

    var nameCell = document.createElement("td");
    nameCell.className = "file-name-cell";
    nameCell.setAttribute("data-label", "File name");
    nameCell.textContent = fileRecord.fileName;
    nameCell.title = fileRecord.fileName;
    fileRow.appendChild(nameCell);

    var channelCell = document.createElement("td");
    channelCell.setAttribute("data-label", "Channel");
    var channelBadge = document.createElement("span");
    channelBadge.className = "badge badge-role";
    channelBadge.textContent = fileRecord.fileChannel;
    channelCell.appendChild(channelBadge);
    fileRow.appendChild(channelCell);

    fileRow.appendChild(buildTextCell(formatBytes(fileRecord.fileSize), "Size"));

    var validationCell = buildValidationCell(fileRecord);
    validationCell.setAttribute("data-label", "Validation");
    fileRow.appendChild(validationCell);

    var statusCell = buildOrderStatusCell(fileRecord);
    statusCell.setAttribute("data-label", "Order status");
    fileRow.appendChild(statusCell);

    var actionsCell = buildActionsCell(fileRecord);
    actionsCell.setAttribute("data-label", "Actions");
    fileRow.appendChild(actionsCell);

    return fileRow;

}

// builds the validation badge cell
function buildValidationCell(fileRecord) {

    var cellElement = document.createElement("td");
    var badgeElement = document.createElement("span");
    var isValid = fileRecord.validationResult === VALIDATION_RESULTS.VALID;

    badgeElement.className = "badge " + (isValid ? "badge-success" : "badge-danger");
    badgeElement.textContent = fileRecord.fileDisposed ? "Disposed" : fileRecord.validationResult;
    badgeElement.title = fileRecord.flagReasonText || "File passed validation";
    cellElement.appendChild(badgeElement);

    return cellElement;
}

// builds the validation badge cell
function buildOrderStatusCell(fileRecord) {
    var cellElement = document.createElement("td");
    var linkedOrder = getSelectedOrderForId(fileRecord.orderId);

    cellElement.textContent = linkedOrder ? linkedOrder.status : "Order unavailable";
    return cellElement;
}

function getSelectedOrderForId(orderId) {
    var orders = getOrderSnapshot();

    for (var index = 0; index < orders.length; index++) {
        if (Number(orders[index].orderId) === Number(orderId)) {
            return orders[index];
        }
    }

    return null;
}

// builds the row-action buttons cell
function buildActionsCell(fileRecord) {

    var actionsCell = document.createElement("td");
    actionsCell.className = "row-actions";
    actionsCell.style.display = "flex";
    actionsCell.style.flexWrap = "nowrap";
    actionsCell.style.alignItems = "center";
    actionsCell.style.gap = "6px";

    var viewButton = document.createElement("button");
    viewButton.type = "button";
    viewButton.className = "btn btn-secondary btn-small";
    viewButton.textContent = "View";
    viewButton.style.whiteSpace = "nowrap";
    viewButton.style.flexShrink = "0";

    viewButton.addEventListener("click", function () {
        openViewModal(fileRecord.fileId);
    });

    actionsCell.appendChild(viewButton);

    if (!fileRecord.fileDisposed) {

        var revalidateButton = document.createElement("button");
        revalidateButton.type = "button";
        revalidateButton.className = "btn btn-secondary btn-small";
        revalidateButton.textContent = "Re-check";
        revalidateButton.style.whiteSpace = "nowrap";
        revalidateButton.style.flexShrink = "0";

        revalidateButton.addEventListener("click", function () {
            revalidateFile(fileRecord.fileId);
        });

        actionsCell.appendChild(revalidateButton);

        var disposeButton = document.createElement("button");
        disposeButton.type = "button";
        disposeButton.className = "btn btn-danger btn-small";
        disposeButton.textContent = "Dispose";
        disposeButton.style.whiteSpace = "nowrap";
        disposeButton.style.flexShrink = "0";

        disposeButton.addEventListener("click", function () {
            disposeFile(fileRecord.fileId, DISPOSAL_TRIGGERS.MANUAL_STAFF);
        });

        actionsCell.appendChild(disposeButton);

    }

    return actionsCell;

}

// builds a plain text cell
function buildTextCell(cellValueText, labelText) {

    var textCell = document.createElement("td");
    textCell.setAttribute("data-label", labelText || "Value");
    textCell.textContent = cellValueText === "" ? "—" : cellValueText;

    return textCell;

}


/* --------------------------------------------------------------------------
   14. SUMMARY STATS
   -------------------------------------------------------------------------- */

// recomputes the four stat cards
function renderStats() {

    var totalCount    = ListSize(filesList);
    var validCount    = 0;
    var flaggedCount  = 0;
    var disposedCount = 0;
    var index;

    for (index = 0; index < totalCount; index++) {

        var currentFile = ListGet(filesList, index);

        if (currentFile.fileDisposed) {
            disposedCount = disposedCount + 1;
        } else if (currentFile.validationResult === VALIDATION_RESULTS.VALID) {
            validCount = validCount + 1;
        } else {
            flaggedCount = flaggedCount + 1;
        }

    }

    document.getElementById("stat-total").textContent    = totalCount;
    document.getElementById("stat-valid").textContent    = validCount;
    document.getElementById("stat-flagged").textContent  = flaggedCount;
    document.getElementById("stat-disposed").textContent = disposedCount;

}


/* --------------------------------------------------------------------------
   15. VIEW MODAL
   -------------------------------------------------------------------------- */

// opens the file-details dialog
function openViewModal(targetFileId) {

    var targetFile = findFile(targetFileId);

    if (!targetFile) {
        return;
    }

    lastFocusedElement = document.activeElement;

    viewModalBody.textContent = "";
    viewModalBody.appendChild(buildDetailGrid(targetFile));

    viewModal.hidden = false;
    addClassToken(viewModal, "open");

    document.getElementById("view-modal-close").focus();

}

// closes the file-details dialog
function closeViewModal() {

    viewModal.hidden = true;
    removeClassToken(viewModal, "open");

    if (lastFocusedElement) {
        lastFocusedElement.focus();
    }

}

// builds the details grid
function buildDetailGrid(fileRecord) {

    var gridElement = document.createElement("div");
    gridElement.className = "profile-list";

    gridElement.appendChild(buildDetailItem("File ID", formatFileId(fileRecord.fileId)));
    gridElement.appendChild(buildDetailItem("Linked order", fileRecord.orderId));
    gridElement.appendChild(buildDetailItem("File name", fileRecord.fileName, true));
    gridElement.appendChild(buildDetailItem("Received via", fileRecord.fileChannel));
    gridElement.appendChild(buildDetailItem("File size", formatBytes(fileRecord.fileSize)));
    gridElement.appendChild(buildDetailItem("Uploaded on", formatDateForDisplay(fileRecord.dateAdded)));

    if (fileRecord.fileDisposed) {
        gridElement.appendChild(buildDetailItem("Status", "Disposed"));
        gridElement.appendChild(buildDetailItem("Disposed on", fileRecord.dateDisposed));
        gridElement.appendChild(buildDetailItem("Disposed by", fileRecord.disposedBy, true));
    } else {
        gridElement.appendChild(buildDetailItem("Validation", fileRecord.validationResult + " — " + fileRecord.flagReasonText));
        gridElement.appendChild(buildDetailItem("Order status", fileRecord.status));
    }

    return gridElement;

}

// builds one label/value pair
function buildDetailItem(labelText, valueText, isFullWidth) {

    var itemElement = document.createElement("div");
    itemElement.className = "activity-item";

    var labelElement = document.createElement("p");
    labelElement.className = "profile-label";
    labelElement.textContent = labelText;

    var valueElement = document.createElement("p");
    valueElement.className = "profile-value";
    valueElement.textContent = valueText;

    itemElement.appendChild(labelElement);
    itemElement.appendChild(valueElement);

    return itemElement;

}


/* --------------------------------------------------------------------------
   16. EXPORT VIA SPREADSHEET (file log + audit log)
   -------------------------------------------------------------------------- */

// escapes one CSV field ly
function escapeCsvField(rawValue) {

    var textValue   = String(rawValue);
    var needsQuotes = false;
    var escapedText = "";
    var charIndex;
    var currentChar;

    for (charIndex = 0; charIndex < textValue.length; charIndex++) {

        currentChar = textValue[charIndex];

        if (currentChar === "," || currentChar === '"' || currentChar === "\n" || currentChar === "\r") {
            needsQuotes = true;
        }

        if (currentChar === '"') {
            escapedText = escapedText + '"' + '"';
        } else {
            escapedText = escapedText + currentChar;
        }

    }

    if (needsQuotes) {
        return '"' + escapedText + '"';
    }

    return escapedText;

}

// builds the file log CSV text
function buildCsv() {

    var csvLinesList = createList();

    var headerFieldsList = createList();
    ListAppend(headerFieldsList, "File ID");
    ListAppend(headerFieldsList, "Linked order");
    ListAppend(headerFieldsList, "File name");
    ListAppend(headerFieldsList, "Channel");
    ListAppend(headerFieldsList, "Size (bytes)");
    ListAppend(headerFieldsList, "Uploaded on");
    ListAppend(headerFieldsList, "Validation");
    ListAppend(headerFieldsList, "Flag reason");
    ListAppend(headerFieldsList, "Order status");
    ListAppend(headerFieldsList, "Disposed");
    ListAppend(headerFieldsList, "Disposed on");
    ListAppend(headerFieldsList, "Disposed by");

    ListAppend(csvLinesList, JoinList(headerFieldsList, ","));

    var totalCount = ListSize(filesList);
    var index;

    for (index = 0; index < totalCount; index++) {

        var currentFile = ListGet(filesList, index);

        var rowFieldsList = createList();
        ListAppend(rowFieldsList, escapeCsvField(formatFileId(currentFile.fileId)));
        ListAppend(rowFieldsList, escapeCsvField(currentFile.orderId));
        ListAppend(rowFieldsList, escapeCsvField(currentFile.fileName));
        ListAppend(rowFieldsList, escapeCsvField(currentFile.fileChannel));
        ListAppend(rowFieldsList, escapeCsvField(currentFile.fileSize));
        ListAppend(rowFieldsList, escapeCsvField(currentFile.dateAdded));
        ListAppend(rowFieldsList, escapeCsvField(currentFile.fileDisposed ? "Disposed" : currentFile.validationResult));
        ListAppend(rowFieldsList, escapeCsvField(currentFile.flagReasonText));
        ListAppend(rowFieldsList, escapeCsvField(currentFile.status));
        ListAppend(rowFieldsList, escapeCsvField(currentFile.fileDisposed ? "Yes" : "No"));
        ListAppend(rowFieldsList, escapeCsvField(currentFile.dateDisposed));
        ListAppend(rowFieldsList, escapeCsvField(currentFile.disposedBy));

        ListAppend(csvLinesList, JoinList(rowFieldsList, ","));

    }

    return JoinList(csvLinesList, "\r\n");

}

// triggers a text file download
function downloadCsv(csvContentsText, downloadFileName) {

    var csvBlob      = new Blob(["\uFEFF" + csvContentsText], { type: "text/csv;charset=utf-8" });
    var csvObjectUrl = URL.createObjectURL(csvBlob);

    var downloadLink = document.createElement("a");
    downloadLink.href = csvObjectUrl;
    downloadLink.download = downloadFileName;

    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);

    URL.revokeObjectURL(csvObjectUrl);

}

// exports the file log button handler
function exportFileLog() {

    if (ListSize(filesList) === 0) {
        showToast("Nothing to export yet", TOAST_KINDS.ERROR);
        return;
    }

    downloadCsv(buildCsv(), "file-handling-log-" + todayAsInputValue() + ".csv");

    showToast("File log exported", TOAST_KINDS.SUCCESS);

}

// exports the audit stack button handler
function exportAuditLog() {

    var totalCount = StackSize(auditStack);

    if (totalCount === 0) {
        showToast("No audit entries yet", TOAST_KINDS.ERROR);
        return;
    }

    var csvLinesList = createList();

    var headerFieldsList = createList();
    ListAppend(headerFieldsList, "Timestamp");
    ListAppend(headerFieldsList, "Action");
    ListAppend(headerFieldsList, "Detail");

    ListAppend(csvLinesList, JoinList(headerFieldsList, ","));

    var offsetIndex;

    for (offsetIndex = 0; offsetIndex < totalCount; offsetIndex++) {

        var entryRecord = StackGetFromTop(auditStack, offsetIndex);

        var rowFieldsList = createList();
        ListAppend(rowFieldsList, escapeCsvField(entryRecord.entryTime));
        ListAppend(rowFieldsList, escapeCsvField(entryRecord.actionType));
        ListAppend(rowFieldsList, escapeCsvField(entryRecord.detailText));

        ListAppend(csvLinesList, JoinList(rowFieldsList, ","));

    }

    downloadCsv(JoinList(csvLinesList, "\r\n"), "disposal-audit-log-" + todayAsInputValue() + ".csv");

    showToast("Audit log exported", TOAST_KINDS.SUCCESS);

}


/* --------------------------------------------------------------------------
   17. EVENTS
   -------------------------------------------------------------------------- */

document.getElementById("export-btn").addEventListener("click", exportFileLog);
document.getElementById("save-btn").addEventListener("click", saveFile);
document.getElementById("cancel-btn").addEventListener("click", closeFileModal);
document.getElementById("modal-close").addEventListener("click", closeFileModal);
document.getElementById("view-modal-close").addEventListener("click", closeViewModal);
document.getElementById("view-modal-done").addEventListener("click", closeViewModal);

searchInput.addEventListener("input", renderTable);

orderIdInput.addEventListener("change", updateSelectedOrderChannel);

function handleOrderSnapshotUpdate() {
    syncFilesFromOrders();
    var orders = getOrderSnapshot();

    for (var fileIndex = 0; fileIndex < ListSize(filesList); fileIndex++) {
        var fileRecord = ListGet(filesList, fileIndex);
        var linkedOrder = null;

        for (var orderIndex = 0; orderIndex < orders.length; orderIndex++) {
            if (Number(orders[orderIndex].orderId) === Number(fileRecord.orderId)) {
                linkedOrder = orders[orderIndex];
                break;
            }
        }

        if (!linkedOrder) continue;

        fileRecord.status = linkedOrder.status;

        if (linkedOrder.status === ORDER_STATUS.DONE && !fileRecord.fileDisposed) {
            disposeFile(fileRecord.fileId, DISPOSAL_TRIGGERS.AUTO_ORDER_DONE);
        }
    }

    populateOrderSelect();
    renderTable();
    renderStats();
}

window.addEventListener("storage", function (event) {
    if (event.key === "gsj_orders_snapshot") handleOrderSnapshotUpdate();
});

window.addEventListener("gsj:orders-updated", handleOrderSnapshotUpdate);


// processes one selected or dropped file
function processChosenFile(chosenFile) {

    pickedFile = null;
    pickedFileHeaderCheck = null;
    isCheckingFile = false;

    if (!chosenFile) {
        resetFileDropUI();
        return;
    }

    if (chosenFile.size > MAX_FILE_BYTES) {

        filePicker.value = "";
        resetFileDropUI();

        showToast(
            chosenFile.name + " is " + formatBytes(chosenFile.size) + ", over the size limit",
            TOAST_KINDS.ERROR
        );

        return;

    }

    var chosenFileExtensionText = getExtension(chosenFile.name);

    if (!arrayContainsValue(ALLOWED_EXTENSIONS, chosenFileExtensionText)) {

        filePicker.value = "";
        resetFileDropUI();

        showToast(
            chosenFile.name + " is not a supported file type (." + chosenFileExtensionText + ")",
            TOAST_KINDS.ERROR
        );

        return;

    }

    pickedFile = chosenFile;
    removeClassToken(fileDrop, "input-invalid");
    removeClassToken(fileDrop, "btn-success");
    removeClassToken(fileDrop, "btn-danger");
    addClassToken(fileDrop, "btn-secondary");
    fileDrop.textContent = "Checking " + chosenFile.name + " ...";
    fileStatus.textContent = "Checking file signature...";

    isCheckingFile = true;

    checkFileHeader(chosenFile, function (headerCheckResult) {

        // ignores a stale, outdated pick
        if (pickedFile !== chosenFile) {
            return;
        }

        isCheckingFile = false;
        pickedFileHeaderCheck = headerCheckResult;

        if (headerCheckResult.headerIsValid) {
            removeClassToken(fileDrop, "btn-secondary");
            addClassToken(fileDrop, "btn-success");
            fileDrop.textContent = chosenFile.name + " has been chosen";
            fileStatus.textContent = formatBytes(chosenFile.size);
        } else {
            removeClassToken(fileDrop, "btn-secondary");
            addClassToken(fileDrop, "btn-danger");
            fileDrop.textContent = chosenFile.name + " is invalid";
            fileStatus.textContent = headerCheckResult.headerReasonText;
            showToast("Scan found: " + headerCheckResult.headerReasonText, TOAST_KINDS.WARNING);
        }

    });

}

// accepts a selected file
filePicker.addEventListener("change", function () {
    processChosenFile(filePicker.files[0] || null);
});

// accepts a dropped file without changing the stylesheet
fileDrop.addEventListener("dragover", function (dragEvent) {
    dragEvent.preventDefault();
});

fileDrop.addEventListener("drop", function (dropEvent) {

    dropEvent.preventDefault();

    var droppedFile = dropEvent.dataTransfer.files[0] || null;
    processChosenFile(droppedFile);

});


// closes dialog on backdrop click
fileModal.addEventListener("click", function (clickEvent) {

    if (clickEvent.target === fileModal) {
        closeFileModal();
    }

});

viewModal.addEventListener("click", function (clickEvent) {

    if (clickEvent.target === viewModal) {
        closeViewModal();
    }

});


// closes open dialog on Escape
document.addEventListener("keydown", function (keyboardEvent) {

    if (keyboardEvent.key === "Escape") {

        if (!fileModal.hidden) {
            closeFileModal();
        } else if (!viewModal.hidden) {
            closeViewModal();
        }

    }

});


// Enter key saves from text fields
fileModal.addEventListener("keydown", function (keyboardEvent) {

    var isTextField =
        keyboardEvent.target.tagName === "INPUT" &&
        keyboardEvent.target.type !== "checkbox" &&
        keyboardEvent.target.type !== "file";

    if (keyboardEvent.key === "Enter" && isTextField) {
        keyboardEvent.preventDefault();
        saveFile();
    }

});


/* --------------------------------------------------------------------------
   18. START
   -------------------------------------------------------------------------- */

handleOrderSnapshotUpdate();
populateChannelSelect();  // channel options come from ORDER_CHANNELS only
populateOrderSelect();
renderTable();
renderStats();
renderAuditLog();
    </script>

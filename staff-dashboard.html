<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Staff Dashboard — Grea San Jave</title>
<link rel="stylesheet" href="css/anika.css" />
</head>
<body>
<div id="toastContainer" aria-live="polite"></div>

<header class="app-header">
  <div class="brand">
    <img src="../grea_logo.jpg" alt="Grea San Jave logo" onerror="this.style.display='none'" />
    <span class="brand-text"><span class="secondary">Grea</span> San <span class="accent">Jave</span></span>
  </div>
  <nav class="app-nav">
    <a href="staff-dashboard.html" class="active">Dashboard</a>
    <a href="customer-list.html">Customers</a>
    <a href="profile.html">My Profile</a>
  </nav>
  <div class="session-info">
    <span id="currentUserLabelStaff"></span>
    <button type="button" id="logoutBtnStaff" class="btn btn-secondary btn-small">Log Out</button>
  </div>
</header>

<main>
  <h1 class="dashboard-welcome" id="staffWelcome">Welcome back!</h1>
  <div class="dashboard-columns">
    <div>
      <div class="card">
        <h2 class="card-title">My Recent Activity</h2>
        <div class="activity-feed" id="staffActivityFeed"></div>
      </div>

      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-value" id="statTotalCustomersStaff">0</div>
          <div class="stat-label">Total Customer Accounts</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statActiveCustomersStaff">0</div>
          <div class="stat-label">Active Customers</div>
        </div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2 class="card-title">My Profile</h2>
        <ul class="profile-list">
          <li><span class="profile-label">Full Name</span><span class="profile-value" id="profileFullName"></span></li>
          <li><span class="profile-label">Username</span><span class="profile-value" id="profileUsername"></span></li>
          <li><span class="profile-label">Assigned Duty</span><span class="profile-value" id="profileDuty"></span></li>
          <li><span class="profile-label">Staff Since</span><span class="profile-value" id="profileDateCreated"></span></li>
        </ul>
      </div>

      <div class="card">
        <h2 class="card-title">Quick Actions</h2>
        <div class="quick-actions-grid">
          <a href="customer-list.html" class="btn btn-primary">View Customers</a>
          <a href="profile.html" class="btn btn-secondary">Edit My Profile</a>
        </div>
      </div>

    </div>
  </div>
</main>

<script src="js/constants.js"></script>
<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/activityLog.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboardCommon.js"></script>
<script src="js/staffDashboard.js"></script>
</body>
</html>

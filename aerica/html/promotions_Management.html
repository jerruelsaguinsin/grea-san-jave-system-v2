<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grea San Jave — Module 10: Promotions</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="module-shell">
    <main>
      <h1 class="page-title">Promotions &amp; Discount Management</h1>

      <div class="card">
        <h2 class="card-title">Create a Promotion</h2>
        <form id="promoForm">
          <div class="form-row">
            <div class="form-group">
              <label for="promoType">Promo Type</label>
              <select id="promoType"></select>
            </div>
            <div class="form-group">
              <label for="promoEligibility">Eligibility</label>
              <select id="promoEligibility"></select>
            </div>
          </div>

          <div class="form-group">
            <label for="promoDescription">Description</label>
            <input type="text" id="promoDescription" placeholder="e.g. 10% off for suki customers this exam week">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="promoDiscountType">Discount Type</label>
              <select id="promoDiscountType"></select>
            </div>
            <div class="form-group">
              <label for="promoDiscountValue">Discount Value</label>
              <input type="number" id="promoDiscountValue" min="0" step="1" placeholder="e.g. 10 or 50">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="promoStartDate">Start Date</label>
              <input type="date" id="promoStartDate" style="text-transform:uppercase;">
            </div>
            <div class="form-group">
              <label for="promoEndDate">End Date</label>
              <input type="date" id="promoEndDate" style="text-transform:uppercase;">
            </div>
          </div>

          <p id="promoFormError" class="form-error" style="display:none;"></p>

          <button type="submit" class="btn btn-primary">Create Promotion</button>
        </form>
      </div>

      <div class="card">
        <h2 class="card-title">Active &amp; Past Promotions</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Promo Type</th>
                <th>Description</th>
                <th>Discount</th>
                <th>Eligibility</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="promoGrid"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="promotions_Management.js"></script>
</body>
</html>
